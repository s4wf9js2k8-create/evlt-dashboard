<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EVLT Operations Platform</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
      :root { 
        --primary: #1e3a1e; 
        --primary-hover: #152915;
        --primary-light: #f0f4f0;
        --accent: #2d5a2d;
        
        --bg: #f8fafc; 
        --card-bg: #ffffff; 
        --sidebar-bg: #0f172a;
        --sidebar-hover: #1e293b;
        --sidebar-text: #94a3b8;
        --sidebar-text-active: #ffffff;
        
        --text: #0f172a; 
        --text-muted: #64748b;
        --border: #e2e8f0; 
        --border-subtle: #f1f5f9;
        
        --radius-sm: 4px;
        --radius: 6px;
        --radius-lg: 8px;
        
        --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.03);
        --shadow: 0 1px 3px 0 rgb(0 0 0 / 0.06), 0 1px 2px -1px rgb(0 0 0 / 0.04);
        --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.08);
        --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      }

      * { box-sizing: border-box; margin: 0; padding: 0; font-family: var(--font-sans); }
      body { background: var(--bg); color: var(--text); display: flex; flex-direction: column; min-height: 100vh; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
      
      header { 
        background: var(--primary); 
        color: white; 
        padding: 0 1rem; 
        display: flex; 
        justify-content: space-between; 
        align-items: center; 
        position: sticky; 
        top: 0; 
        z-index: 1001; 
        height: 56px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        width: 100%;
      }
      .header-left { display: flex; align-items: center; gap: 0.6rem; min-width: 0; }
      .header-right { display: flex; align-items: center; gap: 1rem; }
      
      .header-logo { width: 34px; height: 34px; flex-shrink: 0; display: block; }
      .brand-title { display: flex; align-items: center; gap: 0.5rem; font-weight: 600; font-size: 0.9rem; letter-spacing: -0.01em; color: #ffffff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      
      .menu-btn { display: none; background: none; border: none; color: white; cursor: pointer; padding: 0.25rem; border-radius: var(--radius-sm); flex-shrink: 0; }
      .menu-btn:hover { background: rgba(255,255,255,0.1); }
      
      .user-select-container { display: flex; align-items: center; gap: 0.5rem; background: rgba(255,255,255,0.1); padding: 0.25rem 0.5rem; border-radius: var(--radius-sm); border: 1px solid rgba(255,255,255,0.2); font-size: 0.8rem; font-weight: 600; color: #fff; }

      .app-container { display: flex; flex: 1; position: relative; width: 100%; }
      
      sidebar { 
        width: 230px; 
        background: var(--sidebar-bg); 
        color: var(--sidebar-text); 
        padding: 0.85rem 0.65rem 4rem 0.65rem; 
        flex-shrink: 0; 
        display: flex;
        flex-direction: column;
        gap: 0.15rem;
        transition: transform 0.2s ease; 
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        max-height: calc(100vh - 56px);
        border-right: 1px solid var(--border);
      }
      .sidebar-section-label { font-size: 0.65rem; text-transform: uppercase; font-weight: 700; letter-spacing: 0.08em; color: #64748b; padding: 0.65rem 0.65rem 0.25rem 0.65rem; }
      sidebar a { 
        display: flex; 
        align-items: center; 
        gap: 0.65rem; 
        padding: 0.5rem 0.65rem; 
        color: var(--sidebar-text); 
        text-decoration: none; 
        font-weight: 500; 
        font-size: 0.85rem; 
        border-radius: var(--radius-sm);
        transition: background 0.15s ease, color 0.15s ease;
      }
      sidebar a:hover { background: var(--sidebar-hover); color: var(--sidebar-text-active); }
      sidebar a.active { background: var(--primary); color: var(--sidebar-text-active); font-weight: 600; }
      sidebar a.restricted { opacity: 0.5; cursor: not-allowed; }
      sidebar a i { width: 16px; height: 16px; opacity: 0.85; flex-shrink: 0; }
      
      .overlay { display: none; position: fixed; inset: 0; background: rgba(15, 23, 42, 0.4); backdrop-filter: blur(2px); z-index: 999; }
      
      main { flex: 1; padding: 1.25rem 1.5rem; max-width: 1300px; width: 100%; margin: 0 auto; min-width: 0; overflow-x: hidden; }
      
      .page-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 1rem; margin-bottom: 1.25rem; border-bottom: 1px solid var(--border); padding-bottom: 0.75rem; flex-wrap: wrap; }
      .page-title h2 { font-size: 1.25rem; font-weight: 700; color: var(--text); letter-spacing: -0.02em; line-height: 1.2; }
      .page-title p { font-size: 0.8rem; color: var(--text-muted); margin-top: 0.2rem; }
      
      .btn { display: inline-flex; align-items: center; justify-content: center; gap: 0.4rem; padding: 0.45rem 0.85rem; border-radius: var(--radius); font-size: 0.825rem; font-weight: 600; cursor: pointer; border: 1px solid transparent; transition: all 0.15s ease; white-space: nowrap; }
      .btn i { width: 15px; height: 15px; flex-shrink: 0; }
      .btn-primary { background: var(--primary); color: white; border-color: var(--primary); }
      .btn-primary:hover { background: var(--primary-hover); border-color: var(--primary-hover); }
      .btn-secondary { background: white; border-color: var(--border); color: var(--text); }
      .btn-secondary:hover { background: var(--bg); border-color: #cbd5e1; }
      .btn-subtle { background: transparent; border-color: transparent; color: var(--text-muted); padding: 0.3rem 0.5rem; }
      .btn-subtle:hover { background: var(--border-subtle); color: var(--text); }
      .btn-sm { padding: 0.3rem 0.6rem; font-size: 0.775rem; }
      .btn-danger { background: #dc2626; color: white; border-color: #dc2626; }
      .btn-danger:hover { background: #b91c1c; }

      .badge { display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 0.7rem; font-weight: 600; }
      .badge-success { background: #dcfce7; color: #166534; }
      .badge-warning { background: #fef9c3; color: #854d0e; }
      .badge-danger { background: #fee2e2; color: #991b1b; }
      .badge-info { background: #e0f2fe; color: #075985; }

      .section-group { margin-bottom: 1.75rem; }
      .section-header { font-size: 0.85rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 0.65rem; display: flex; align-items: center; gap: 0.5rem; }
      .section-header::after { content: ''; flex: 1; height: 1px; background: var(--border); }

      .grid-stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 0.85rem; margin-bottom: 1.25rem; }
      .stat-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 0.85rem 1rem; box-shadow: var(--shadow-sm); cursor: pointer; transition: border-color 0.15s ease; display: flex; flex-direction: column; justify-content: space-between; }
      .stat-card:hover { border-color: var(--primary); }
      .stat-header { display: flex; align-items: center; justify-content: space-between; color: var(--text-muted); font-size: 0.775rem; font-weight: 600; }
      .stat-icon { width: 28px; height: 28px; border-radius: var(--radius-sm); background: var(--primary-light); color: var(--primary); display: flex; align-items: center; justify-content: center; }
      .stat-icon i { width: 14px; height: 14px; }
      .stat-value { font-size: 1.35rem; font-weight: 700; color: var(--text); letter-spacing: -0.02em; margin-top: 0.4rem; }

      .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius-lg); box-shadow: var(--shadow-sm); overflow: hidden; width: 100%; margin-bottom: 1rem; }
      .table-container { width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; }
      table { width: 100%; border-collapse: collapse; font-size: 0.8rem; text-align: left; white-space: nowrap; }
      th { background: #f8fafc; font-weight: 600; color: var(--text-muted); padding: 0.6rem 0.75rem; border-bottom: 1px solid var(--border); font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.04em; }
      td { padding: 0.65rem 0.75rem; border-bottom: 1px solid var(--border-subtle); color: var(--text); vertical-align: middle; }
      tbody tr:last-child td { border-bottom: none; }
      tbody tr:hover { background: #f8fafc; }

      .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(15, 23, 42, 0.4); backdrop-filter: blur(2px); justify-content: center; align-items: center; z-index: 1100; padding: 1rem; }
      .modal { background: white; padding: 1.25rem; border-radius: var(--radius-lg); width: 100%; max-width: 520px; max-height: 85vh; overflow-y: auto; box-shadow: var(--shadow-lg); border: 1px solid var(--border); }
      .modal h3 { font-size: 1rem; font-weight: 700; color: var(--text); margin-bottom: 0.85rem; border-bottom: 1px solid var(--border); padding-bottom: 0.5rem; }
      .form-group { margin-bottom: 0.75rem; }
      .form-group label { display: block; font-size: 0.75rem; font-weight: 600; margin-bottom: 0.2rem; color: var(--text); }
      .form-group input, .form-group textarea, .form-group select { width: 100%; padding: 0.45rem 0.6rem; border: 1px solid var(--border); border-radius: var(--radius); font-size: 0.8rem; outline: none; background: white; transition: border-color 0.15s; }
      .modal-actions { display: flex; justify-content: flex-end; gap: 0.4rem; margin-top: 1rem; border-top: 1px solid var(--border); padding-top: 0.75rem; }

      .arch-section-box { background: #f8fafc; border: 1px solid var(--border); border-radius: var(--radius); padding: 0.85rem; margin-bottom: 1rem; }
      .arch-section-title { font-size: 0.8rem; font-weight: 700; text-transform: uppercase; color: var(--primary); margin-bottom: 0.6rem; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #e2e8f0; padding-bottom: 0.3rem; }

      .alert-box { padding: 0.75rem; border-radius: var(--radius); border: 1px solid var(--border); font-size: 0.8rem; margin-bottom: 1rem; display: flex; align-items: center; gap: 0.5rem; }
      .alert-danger { background: #fef2f2; border-color: #fca5a5; color: #991b1b; }
      .alert-info { background: #f0f9ff; border-color: #bae6fd; color: #075985; }

      @media (max-width: 768px) {
        .menu-btn { display: block; }
        sidebar { 
          position: fixed; top: 56px; left: 0; bottom: 0; height: calc(100vh - 56px); z-index: 1000; 
          transform: translateX(-100%); width: 230px; padding-top: 0.85rem; padding-bottom: 4rem; overflow-y: auto; 
        }
        sidebar.active { transform: translateX(0); }
        .overlay.active { display: block; }
        main { padding: 0.85rem; }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="header-left">
        <button class="menu-btn" onclick="toggleMenu()" aria-label="Toggle navigation menu">
          <i data-lucide="menu"></i>
        </button>
        <svg class="header-logo" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
          <circle cx="50" cy="50" r="48" fill="#fcf8ee" stroke="#1e3a1e" stroke-width="4"/>
          <defs>
            <path id="topArc" d="M 15,50 A 35,35 0 0,1 85,50" />
            <path id="bottomArc" d="M 85,50 A 35,35 0 0,1 15,50" />
          </defs>
          <text font-family="-apple-system, sans-serif" font-size="8.5" font-weight="bold" fill="#1e3a1e">
            <textPath href="#topArc" startOffset="50%" text-anchor="middle">WHEELS OF TIME</textPath>
          </text>
          <text font-family="-apple-system, sans-serif" font-size="7" font-weight="bold" fill="#1e3a1e">
            <textPath href="#bottomArc" startOffset="50%" text-anchor="middle">RAILWAY MUSEUM</textPath>
          </text>
          <rect x="20" y="38" width="60" height="24" rx="12" fill="#1e3a1e"/>
          <rect x="22" y="40" width="56" height="20" rx="10" fill="#fcf8ee"/>
          <text x="50" y="49" font-family="serif" font-size="6.5" font-weight="bold" fill="#1e3a1e" text-anchor="middle">ELHAM VALLEY</text>
          <text x="50" y="56" font-family="-apple-system, sans-serif" font-size="4" font-weight="bold" fill="#1e3a1e" text-anchor="middle">LINE TRUST</text>
        </svg>
        <div class="brand-title">
          <span>EVLT Operations</span>
        </div>
      </div>
      <div class="header-right">
        <div class="user-select-container" id="currentUserBadge" style="cursor: pointer;" onclick="openLoginModal()" title="Switch Account">
          <i data-lucide="user" style="width: 14px; height: 14px; color: white;"></i>
          <span id="currentUserDisplayName">Not Logged In</span>
        </div>
      </div>
    </header>

    <div class="overlay" id="overlay" onclick="toggleMenu()"></div>
    <div class="app-container">
      <sidebar id="sidebar">
        <!-- Dynamically rendered -->
      </sidebar>
      <main id="content">
        <!-- Renders dynamically -->
      </main>
    </div>

    <!-- Custom Dialog Modal (Replaces browser alert) -->
    <div class="modal-overlay" id="alertModal">
      <div class="modal" style="max-width: 400px;">
        <h3 id="alertModalTitle">Notice</h3>
        <p id="alertModalMessage" style="font-size:0.85rem; color: var(--text-muted); margin-bottom: 1rem; line-height: 1.4;"></p>
        <div class="modal-actions" style="border-top: 1px solid var(--border); padding-top: 0.75rem;">
          <button type="button" class="btn btn-primary" onclick="closeModal('alertModal')">OK</button>
        </div>
      </div>
    </div>

    <!-- Custom Confirmation Modal (Replaces browser confirm) -->
    <div class="modal-overlay" id="confirmModal">
      <div class="modal" style="max-width: 400px;">
        <h3 id="confirmModalTitle">Confirm Action</h3>
        <p id="confirmModalMessage" style="font-size:0.85rem; color: var(--text-muted); margin-bottom: 1rem; line-height: 1.4;"></p>
        <div class="modal-actions" style="border-top: 1px solid var(--border); padding-top: 0.75rem;">
          <button type="button" class="btn btn-secondary" onclick="closeModal('confirmModal')">Cancel</button>
          <button type="button" class="btn btn-danger" onclick="handleConfirmExecute()">Confirm</button>
        </div>
      </div>
    </div>

    <!-- Login Modal -->
    <div class="modal-overlay" id="loginModal">
      <div class="modal" style="max-width: 380px;">
        <h3>Sign In to EVLT Operations</h3>
        <form onsubmit="handleUserLogin(event)">
          <div class="form-group">
            <label>Select Account</label>
            <select id="loginUserSelect" required class="form-group">
              <option value="">-- Choose Account --</option>
            </select>
          </div>
          <div class="form-group">
            <label>PIN Code / Password</label>
            <input type="password" id="loginUserPin" placeholder="Enter PIN" required>
          </div>
          <div id="loginErrorMsg" style="color: #dc2626; font-size: 0.75rem; margin-bottom: 0.5rem; display: none;">Incorrect PIN. Please try again.</div>
          <div class="form-group" style="display:flex; align-items:center; gap:0.5rem;">
            <input type="checkbox" id="rememberDeviceCheckbox" style="width:auto;" checked>
            <label for="rememberDeviceCheckbox" style="margin:0; font-weight:500;">Remember this device</label>
          </div>
          <div class="modal-actions" style="border:none; padding:0; margin-top:1rem;">
            <button type="submit" class="btn btn-primary" style="width:100%; justify-content:center;">Sign In</button>
          </div>
        </form>
      </div>
    </div>

    <!-- Volunteer Modal (Add / Edit) -->
    <div class="modal-overlay" id="volunteerModal">
      <div class="modal">
        <h3 id="volunteerModalTitle">Add Volunteer</h3>
        <form onsubmit="saveVolunteer(event)">
          <input type="hidden" id="volEditIndex" value="">
          <div class="form-group">
            <label>Full Name</label>
            <input type="text" id="volName" placeholder="e.g. John Smith" required>
          </div>
          <div class="form-group">
            <label>PIN Code</label>
            <input type="password" id="volPin" placeholder="4 digit PIN" required>
          </div>
          <div class="form-group">
            <label>Assigned Roles & Permissions</label>
            <div id="volRolesCheckboxes" style="display:flex; flex-direction:column; gap:0.4rem; border:1px solid var(--border); padding:0.5rem; border-radius:var(--radius); background:#f8fafc;">
            </div>
          </div>
          <div class="form-group">
            <label>DBS Check Status</label>
            <select id="volDbs">
              <option value="Cleared">Cleared</option>
              <option value="Pending">Pending</option>
              <option value="Not Required">Not Required</option>
            </select>
          </div>
          <div class="modal-actions">
            <button type="button" class="btn btn-secondary" onclick="closeModal('volunteerModal')">Cancel</button>
            <button type="submit" class="btn btn-primary">Save Volunteer</button>
          </div>
        </form>
      </div>
    </div>

    <!-- Fleet / Locomotive Modal (Add / Edit Multiple Choice) -->
    <div class="modal-overlay" id="fleetModal">
      <div class="modal">
        <h3 id="fleetModalTitle">Add / Edit Locomotive</h3>
        <form onsubmit="saveFleetItem(event)">
          <input type="hidden" id="fleetEditIndex" value="">
          <div class="form-group">
            <label>Locomotive / Asset Name</label>
            <input type="text" id="fleetName" placeholder="e.g. Canadian Pacific, DB, Santa Fe" required>
          </div>
          <div class="form-group">
            <label>Traction Type</label>
            <select id="fleetType" required>
              <option value="Steam">Steam</option>
              <option value="Diesel">Diesel</option>
              <option value="Electric">Electric</option>
              <option value="Coach">Coach</option>
              <option value="Other">Other</option>
            </select>
          </div>
          <div class="form-group">
            <label>Track Gauge</label>
            <select id="fleetGauge" required>
              <option value="5''">5''</option>
              <option value="7 1/4''">7 1/4''</option>
              <option value="Other">Other</option>
            </select>
          </div>
          <div class="form-group">
            <label>Operational Status</label>
            <select id="fleetState" required>
              <option value="In Service">In Service</option>
              <option value="Out of Service">Out of Service</option>
              <option value="Overhaul">Overhaul</option>
            </select>
          </div>
          <div class="modal-actions">
            <button type="button" class="btn btn-secondary" onclick="closeModal('fleetModal')">Cancel</button>
            <button type="submit" class="btn btn-primary">Save Locomotive</button>
          </div>
        </form>
      </div>
    </div>

    <!-- Maintenance Log Modal (Add / Edit) -->
    <div class="modal-overlay" id="maintLogModal">
      <div class="modal">
        <h3 id="maintLogModalTitle">Maintenance Log Entry</h3>
        <form onsubmit="saveMaintenanceLogEntry(event)">
          <input type="hidden" id="maintLogEditIndex" value="">
          <div class="form-group">
            <label>Locomotive / Asset</label>
            <select id="maintLogAsset" required></select>
          </div>
          <div class="form-group">
            <label>Work Done / Description</label>
            <textarea id="maintWorkDone" rows="3" placeholder="Describe the maintenance or repairs performed..." required></textarea>
          </div>
          <div class="form-group" style="display: flex; gap: 0.5rem;">
            <div style="flex:1;">
              <label>Start Date</label>
              <input type="date" id="maintStartDate" required>
            </div>
            <div style="flex:1;">
              <label>End Date</label>
              <input type="date" id="maintEndDate" required>
            </div>
          </div>
          <div class="form-group">
            <label>Performed By (Volunteers)</label>
            <div id="maintVolunteersList" style="display: flex; flex-direction: column; gap: 0.4rem; border: 1px solid var(--border); padding: 0.5rem; border-radius: var(--radius); background: #f8fafc; max-height: 140px; overflow-y: auto;">
            </div>
          </div>
          <div class="form-group">
            <label>Update Asset State</label>
            <select id="maintUpdateState">
              <option value="">-- Keep Current State --</option>
              <option value="In Service">In Service</option>
              <option value="Out of Service">Out of Service</option>
              <option value="Overhaul">Overhaul</option>
            </select>
          </div>
          <div class="form-group">
            <label>Notes / Parts Used</label>
            <textarea id="maintNotes" rows="2" placeholder="Optional notes..."></textarea>
          </div>
          <div class="modal-actions">
            <button type="button" class="btn btn-secondary" onclick="closeModal('maintLogModal')">Cancel</button>
            <button type="submit" class="btn btn-primary">Save Log Entry</button>
          </div>
        </form>
      </div>
    </div>

    <!-- Edit Archive Modal -->
    <div class="modal-overlay" id="editArchiveModal">
      <div class="modal" style="max-width: 700px; max-height: 90vh;">
        <h3>Edit Archive Record (<span id="editArchiveDateTxt"></span>)</h3>
        <form onsubmit="saveArchiveEdit(event)">
          <input type="hidden" id="editArchiveIndex" value="">

          <div class="arch-section-box">
            <div class="arch-section-title">
              <span><i data-lucide="footprints" style="width:14px; height:14px; vertical-align:middle; margin-right:4px;"></i> Track Walk Inspection</span>
            </div>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.6rem;">
              <div class="form-group" style="margin:0;">
                <label>Inspection Outcome</label>
                <select id="editArch_TW_Result">
                  <option value="Pass">Pass</option>
                  <option value="Fail">Fail</option>
                  <option value="Not Completed">Not Completed</option>
                </select>
              </div>
              <div class="form-group" style="margin:0;">
                <label>Inspected By</label>
                <select id="editArch_TW_Inspector"></select>
              </div>
            </div>
            <div class="form-group" style="margin-top:0.5rem; margin-bottom:0;">
              <label>Track Walk Defect / Notes</label>
              <input type="text" id="editArch_TW_Notes" placeholder="Details or defect reason...">
            </div>
          </div>

          <div class="arch-section-box">
            <div class="arch-section-title">
              <span><i data-lucide="play-circle" style="width:14px; height:14px; vertical-align:middle; margin-right:4px;"></i> Test Run & Locomotives</span>
            </div>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.6rem; margin-bottom:0.5rem;">
              <div class="form-group" style="margin:0;">
                <label>Test Run Outcome</label>
                <select id="editArch_TR_Result">
                  <option value="Pass">Pass</option>
                  <option value="Fail">Fail</option>
                  <option value="Not Completed">Not Completed</option>
                </select>
              </div>
              <div class="form-group" style="margin:0;">
                <label>Test Run Inspector</label>
                <select id="editArch_TR_Inspector"></select>
              </div>
            </div>
            <div class="form-group" style="margin:0;">
              <label>Running Locos Used</label>

        projectId: "evlt-admin",

      const realDatabase = firebase.database();

      // Application State store
      let db = {
        volunteers: [
          { Name: 'Louie Hull', Pin: '1234', Roles: 'Admin, Driver, Maintenance, Management', 'DBS Status': 'Cleared' },
          { Name: 'John Smith', Pin: '5678', Roles: 'Driver, Platform', 'DBS Status': 'Cleared' }
        ],

          { name: 'Canadian Pacific', type: 'Steam', gauge: "7 1/4''", state: 'In Service' },
          { name: 'DB', type: 'Diesel', gauge: "7 1/4''", state: 'In Service' },
          { name: 'Santa Fe', type: 'Diesel', gauge: "7 1/4''", state: 'In Service' },
          { name: 'George', type: 'Steam', gauge: "7 1/4''", state: 'In Service' },
          { name: 'Edward', type: 'Steam', gauge: "5''", state: 'In Service' },
          { name: 'Dylan', type: 'Electric', gauge: "5''", state: 'In Service' },
          { name: 'June', type: 'Coach', gauge: "7 1/4''", state: 'In Service' },
          { name: 'Daphne', type: 'Coach', gauge: "7 1/4''", state: 'In Service' }
        ],
        incidents: [],

        clockLogs: [],
        actions: [],
        events: [],
        assets: [],
        stock: [],
        suppliers: [],
        enquiries: [],

        notes: [],
        historicalArchive: []
      };

      let currentView = 'dashboard';
      let currentUser = null; 
      let editingModuleKey = null;
      let editingModuleIndex = null;
      let pendingConfirmAction = null;

      const DEFAULT_ROLES = ["Admin", "Management", "Maintenance", "Driver", "Platform", "Shop", "Barn", "Tearoom"];
      const MANAGEMENT_PAGES = ['assets', 'stock', 'suppliers', 'enquiries', 'documents', 'notes'];

      const ALL_PAGES = [
        { key: 'dashboard', label: 'Dashboard', icon: 'layout-dashboard', section: 'Main' },
        { key: 'clock', label: 'Clock In/Out', icon: 'clock', section: 'Main' },
        { key: 'clockLogs', label: 'Clock Log Records', icon: 'list-checks', section: 'Main' },
        { key: 'volunteers', label: 'Volunteers', icon: 'users', section: 'Operations' },
        { key: 'maintenance', label: 'Maintenance & Fleet', icon: 'wrench', section: 'Operations' },
        { key: 'incidents', label: 'Incident & Defect Log', icon: 'alert-triangle', section: 'Operations' },
        { key: 'actions', label: 'Actions', icon: 'check-square', section: 'Operations' },
        { key: 'events', label: 'Events', icon: 'calendar-range', section: 'Operations' },
        { key: 'assets', label: 'Assets', icon: 'box', section: 'Management' },
        { key: 'stock', label: 'Stock', icon: 'package', section: 'Management' },
        { key: 'suppliers', label: 'Suppliers', icon: 'truck', section: 'Management' },
        { key: 'enquiries', label: 'Enquiries', icon: 'help-circle', section: 'Management' },
        { key: 'documents', label: 'Documents', icon: 'file-text', section: 'Management' },
        { key: 'notes', label: 'Notes', icon: 'sticky-note', section: 'Management' },
        { key: 'archives', label: 'Historical Archives', icon: 'archive', section: 'Archives' }
      ];

      function initFirebaseSync() {
        realDatabase.ref('evlt_data').on('value', (snapshot) => {
          const data = snapshot.val();
          if (data) {
            db = { ...db, ...data };
            if (!db.volunteers) db.volunteers = [];
            if (!db.fleetItems) db.fleetItems = [];
            if (!db.maintenanceLogs) db.maintenanceLogs = [];
            if (!db.historicalArchive) db.historicalArchive = [];
            
            // Re-validate current logged in user session
            if (currentUser) {
              const freshUser = db.volunteers.find(v => v.Name === currentUser.Name);
              if (freshUser) currentUser = freshUser;
            }
            renderApp();
          }
        });
      }

      function saveData(nodeKey) {
        realDatabase.ref('evlt_data/' + nodeKey).set(db[nodeKey]);
      }

      function saveAllData() {
        realDatabase.ref('evlt_data').set(db);
      }

      function customAlert(title, message) {
        document.getElementById('alertModalTitle').textContent = title;
        document.getElementById('alertModalMessage').textContent = message;
        document.getElementById('alertModal').style.display = 'flex';
      }

      function customConfirm(title, message, actionFn) {
        document.getElementById('confirmModalTitle').textContent = title;
        document.getElementById('confirmModalMessage').textContent = message;
        pendingConfirmAction = actionFn;
        document.getElementById('confirmModal').style.display = 'flex';
      }

      function handleConfirmExecute() {
        if (typeof pendingConfirmAction === 'function') {
          pendingConfirmAction();
          pendingConfirmAction = null;
        }
        closeModal('confirmModal');
      }

      function isAdmin() {
        if (!currentUser) return false;
        const roles = (currentUser.Roles || '').split(',').map(r => r.trim().toLowerCase());
        return roles.includes('admin');
      }

      function hasManagementPermission() {
        if (!currentUser) return false;
        if (isAdmin()) return true;
        const roles = (currentUser.Roles || '').split(',').map(r => r.trim().toLowerCase());
        return roles.includes('management');
      }

      function hasMaintenancePermission() {
        if (!currentUser) return false;
        if (isAdmin()) return true;
        const roles = (currentUser.Roles || '').split(',').map(r => r.trim().toLowerCase());
        return roles.includes('maintenance') || roles.includes('management');
      }

      function canAccessPage(pageKey) {
        if (MANAGEMENT_PAGES.includes(pageKey)) {
          return hasManagementPermission();
        }
        return true;
      }

      function toggleMenu() {
        document.getElementById('sidebar').classList.toggle('active');
        document.getElementById('overlay').classList.toggle('active');
      }

      function navigateTo(pageKey) {
        if (!canAccessPage(pageKey)) {
          customAlert("Access Denied", "Access Denied: You require Management permission to access this page.");
          return;
        }
        currentView = pageKey;
        renderApp();
        if (window.innerWidth <= 768) {
          document.getElementById('sidebar').classList.remove('active');
          document.getElementById('overlay').classList.remove('active');
        }
      }

      function renderSidebar() {
        const sidebar = document.getElementById('sidebar');
        let html = '';
        
        let currentSection = '';
        ALL_PAGES.forEach(page => {
          if (page.section !== currentSection) {
            currentSection = page.section;
            html += `<div class="sidebar-section-label">${currentSection}</div>`;
          }
          
          const isRestricted = !canAccessPage(page.key);
          const activeClass = currentView === page.key ? 'active' : '';
          const restrictedClass = isRestricted ? 'restricted' : '';
          const iconRight = isRestricted ? `<i data-lucide="lock" style="width:12px; height:12px; margin-left:auto;"></i>` : '';

          html += `
            <a href="#" class="${activeClass} ${restrictedClass}" onclick="navigateTo('${page.key}'); return false;">
              <i data-lucide="${page.icon}"></i>
              <span>${page.label}</span>
              ${iconRight}
            </a>
          `;
        });

        sidebar.innerHTML = html;
      }

      function renderHeaderUser() {
        const badge = document.getElementById('currentUserDisplayName');
        if (currentUser) {
          badge.textContent = `${currentUser.Name} (${currentUser.Roles || 'User'})`;
        } else {
          badge.textContent = 'Not Logged In - Click to Sign In';
        }
      }

      function renderApp() {
        renderSidebar();
        renderHeaderUser();
        lucide.createIcons();

        const content = document.getElementById('content');

        if (MANAGEMENT_PAGES.includes(currentView) && !hasManagementPermission()) {
          content.innerHTML = `
            <div class="alert-box alert-danger">
              <i data-lucide="shield-alert"></i>
              <span>Access Denied: You do not have the <strong>Management</strong> permission required to access this area.</span>
            </div>
          `;
          lucide.createIcons();
          return;
        }

        switch (currentView) {
          case 'dashboard': renderDashboard(); break;
          case 'clock': renderClockView(); break;
          case 'clockLogs': renderClockLogsView(); break;
          case 'volunteers': renderVolunteers(); break;
          case 'maintenance': renderMaintenance(); break;
          case 'incidents': renderIncidents(); break;
          case 'actions': renderActions(); break;
          case 'events': renderEvents(); break;
          case 'assets': renderGenericModule('assets', 'Assets & Equipment', ['Name', 'Location', 'Condition', 'Notes']); break;
          case 'stock': renderGenericModule('stock', 'Stock Inventory', ['Item Name', 'Category', 'Quantity', 'Reorder Level']); break;
          case 'suppliers': renderGenericModule('suppliers', 'Suppliers & Vendors', ['Company Name', 'Contact Person', 'Phone', 'Email', 'Services']); break;
          case 'enquiries': renderGenericModule('enquiries', 'Customer Enquiries', ['Date', 'Sender', 'Subject', 'Status', 'Notes']); break;
          case 'documents': renderGenericModule('documents', 'Operations Documents', ['Document Title', 'Category', 'Last Revised', 'Status']); break;
          case 'notes': renderGenericModule('notes', 'Management Notes', ['Title', 'Author', 'Date', 'Details']); break;
          case 'archives': renderArchives(); break;
          default: renderDashboard(); break;
        }

        lucide.createIcons();
      }

      function renderDashboard() {
        const activeVolunteers = db.clockLogs.filter(l => !l.clockOut || l.clockOut === '-').length;
        const openDefects = db.incidents.filter(i => i.Status !== 'Resolved').length;
        const inServiceLocos = db.fleetItems.filter(f => f.state === 'In Service').length;

        document.getElementById('content').innerHTML = `
          <div class="page-header">
            <div class="page-title">
              <h2>Operations Dashboard</h2>
              <p>Welcome back to Elham Valley Line Trust Operations Platform</p>
            </div>
            ${!currentUser ? `<button class="btn btn-primary" onclick="openLoginModal()"><i data-lucide="log-in"></i> Sign In</button>` : ''}
          </div>

          <div class="grid-stats">
            <div class="stat-card" onclick="navigateTo('clock')">
              <div class="stat-header">
                <span>Clocked In Now</span>
                <div class="stat-icon"><i data-lucide="users"></i></div>
              </div>
              <div class="stat-value">${activeVolunteers}</div>
            </div>
            <div class="stat-card" onclick="navigateTo('maintenance')">
              <div class="stat-header">
                <span>In-Service Fleet</span>
                <div class="stat-icon"><i data-lucide="train"></i></div>
              </div>
              <div class="stat-value">${inServiceLocos} / ${db.fleetItems.length}</div>
            </div>
            <div class="stat-card" onclick="navigateTo('incidents')">
              <div class="stat-header">
                <span>Active Defects</span>
                <div class="stat-icon"><i data-lucide="alert-triangle"></i></div>
              </div>
              <div class="stat-value">${openDefects}</div>
            </div>
          </div>

          <div class="card">
            <div style="padding:1rem; border-bottom:1px solid var(--border);">
              <h3 style="font-size:0.95rem; font-weight:700;">Active Volunteers On Site</h3>
            </div>
            <div class="table-container">
              <table>
                <thead>
                  <tr>
                    <th>Volunteer Name</th>
                    <th>Clock In Time</th>
                    <th>Date</th>
                    <th>Status</th>
                  </tr>
                </thead>
                <tbody>
                  ${db.clockLogs.filter(l => !l.clockOut || l.clockOut === '-').length === 0 ? 
                    `<tr><td colspan="4" style="text-align:center; color:var(--text-muted);">No volunteers currently clocked in.</td></tr>` :
                    db.clockLogs.filter(l => !l.clockOut || l.clockOut === '-').map(l => `
                      <tr>
                        <td style="font-weight:600;">${l.name}</td>
                        <td>${l.clockIn}</td>
                        <td>${l.date}</td>
                        <td><span class="badge badge-success">Active</span></td>
                      </tr>
                    `).join('')
                  }
                </tbody>
              </table>
            </div>
          </div>
        `;
      }

      function renderClockView() {
        document.getElementById('content').innerHTML = `
          <div class="page-header">
            <div class="page-title">
              <h2>Volunteer Clock In / Out</h2>
              <p>Quick station sign-in for duty shifts</p>
            </div>
          </div>

          <div class="card" style="max-width: 500px; margin: 0 auto; padding: 1.5rem;">
            <div class="form-group">
              <label>Select Volunteer</label>
              <select id="clockVolSelect" style="padding:0.6rem; font-size:0.9rem;">
                <option value="">-- Choose Your Name --</option>
                ${db.volunteers.map(v => `<option value="${v.Name}">${v.Name}</option>`).join('')}
              </select>
            </div>
            <div class="form-group">
              <label>PIN Code</label>
              <input type="password" id="clockVolPin" placeholder="4-digit PIN" style="padding:0.6rem; font-size:0.9rem;">
            </div>
            <div style="display:flex; gap:0.75rem; margin-top:1.25rem;">
              <button class="btn btn-primary" style="flex:1; padding:0.65rem;" onclick="handleClockAction('in')"><i data-lucide="log-in"></i> Clock IN</button>
              <button class="btn btn-secondary" style="flex:1; padding:0.65rem;" onclick="handleClockAction('out')"><i data-lucide="log-out"></i> Clock OUT</button>
            </div>
          </div>
        `;
      }

      function handleClockAction(actionType) {
        const name = document.getElementById('clockVolSelect').value;
        const pin = document.getElementById('clockVolPin').value;

        if (!name || !pin) {
          customAlert("Input Required", "Please select your name and enter your PIN.");
          return;
        }

        const vol = db.volunteers.find(v => v.Name === name && v.Pin === pin);
        if (!vol) {
          customAlert("Authentication Failed", "Incorrect PIN Code.");
          return;
        }

        const today = new Date().toISOString().split('T')[0];
        const timeNow = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

        if (actionType === 'in') {
          db.clockLogs.unshift({
            id: Date.now().toString(),
            name: vol.Name,
            date: today,
            clockIn: timeNow,
            clockOut: '-'
          });
          saveData('clockLogs');
          customAlert("Clock In Successful", `Welcome ${vol.Name}! Clocked IN at ${timeNow}`);
        } else {
          const activeIndex = db.clockLogs.findIndex(l => l.name === vol.Name && (l.clockOut === '-' || !l.clockOut));
          if (activeIndex > -1) {
            db.clockLogs[activeIndex].clockOut = timeNow;
            saveData('clockLogs');
            customAlert("Clock Out Successful", `Thank you ${vol.Name}! Clocked OUT at ${timeNow}`);
          } else {
            customAlert("Notice", "No active clock-in record found for today.");
          }
        }
        document.getElementById('clockVolPin').value = '';
        renderApp();
      }

      function renderClockLogsView() {
        document.getElementById('content').innerHTML = `
          <div class="page-header">
            <div class="page-title">
              <h2>Clock Log Records</h2>
              <p>Historical attendance shifts logged by volunteers</p>
            </div>
          </div>

          <div class="card">
            <div class="table-container">
              <table>
                <thead>
                  <tr>
                    <th>Date</th>
                    <th>Volunteer Name</th>
                    <th>Clock In</th>
                    <th>Clock Out</th>
                    <th>Action</th>
                  </tr>
                </thead>
                <tbody>
                  ${db.clockLogs.length === 0 ? `<tr><td colspan="5" style="text-align:center;">No clock logs recorded yet.</td></tr>` : 
                    db.clockLogs.map((log, index) => `
                      <tr>
                        <td>${log.date}</td>
                        <td style="font-weight:600;">${log.name}</td>
                        <td>${log.clockIn}</td>
                        <td>${log.clockOut}</td>
                        <td>
                          ${isAdmin() ? `<button class="btn btn-danger btn-sm" onclick="deleteClockLog(${index})"><i data-lucide="trash-2"></i> Delete</button>` : '-'}
                        </td>
                      </tr>
                    `).join('')
                  }
                </tbody>
              </table>
            </div>
          </div>
        `;
      }

      function deleteClockLog(index) {
        if (!isAdmin()) return;
        customConfirm("Delete Clock Log", "Are you sure you want to delete this clock record?", () => {
          db.clockLogs.splice(index, 1);
          saveData('clockLogs');
          renderClockLogsView();
        });
      }

      function renderVolunteers() {
        document.getElementById('content').innerHTML = `
          <div class="page-header">
            <div class="page-title">
              <h2>Volunteer Roster</h2>
              <p>Registered volunteers and assigned role permissions</p>
            </div>
            ${isAdmin() ? `<button class="btn btn-primary" onclick="openVolunteerModal()"><i data-lucide="user-plus"></i> Add Volunteer</button>` : ''}
          </div>

          <div class="card">
            <div class="table-container">
              <table>
                <thead>
                  <tr>
                    <th>Name</th>
                    <th>Roles / Permissions</th>
                    <th>DBS Status</th>
                    ${isAdmin() ? `<th style="text-align:right;">Actions</th>` : ''}
                  </tr>
                </thead>
                <tbody>
                  ${db.volunteers.map((vol, index) => `
                    <tr>
                      <td style="font-weight:600;">${vol.Name}</td>
                      <td>${(vol.Roles || '').split(',').map(r => `<span class="badge badge-info" style="margin-right:2px;">${r.trim()}</span>`).join('')}</td>
                      <td><span class="badge badge-success">${vol['DBS Status'] || 'Cleared'}</span></td>
                      ${isAdmin() ? `
                        <td style="text-align:right;">
                          <button class="btn btn-secondary btn-sm" onclick="openVolunteerModal(${index})"><i data-lucide="edit"></i> Edit</button>
                          <button class="btn btn-danger btn-sm" onclick="deleteVolunteer(${index})"><i data-lucide="trash-2"></i> Delete</button>
                        </td>
                      ` : ''}
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>
          </div>
        `;
      }

      function openVolunteerModal(index = null) {
        if (!isAdmin()) {
          customAlert("Permission Denied", "Only Administrators can edit volunteers.");
          return;
        }

        const rolesContainer = document.getElementById('volRolesCheckboxes');
        rolesContainer.innerHTML = DEFAULT_ROLES.map(role => `
          <label style="display:flex; align-items:center; gap:0.4rem; font-size:0.8rem;">
            <input type="checkbox" value="${role}" class="vol-role-checkbox"> ${role}
          </label>
        `).join('');

        if (index !== null) {
          const vol = db.volunteers[index];
          document.getElementById('volEditIndex').value = index;
          document.getElementById('volName').value = vol.Name;
          document.getElementById('volPin').value = vol.Pin;
          document.getElementById('volDbs').value = vol['DBS Status'] || 'Cleared';
          
          const roles = (vol.Roles || '').split(',').map(r => r.trim());
          document.querySelectorAll('.vol-role-checkbox').forEach(cb => {
            cb.checked = roles.includes(cb.value);
          });
          document.getElementById('volunteerModalTitle').textContent = 'Edit Volunteer';
        } else {
          document.getElementById('volEditIndex').value = '';
          document.getElementById('volName').value = '';
          document.getElementById('volPin').value = '';
          document.getElementById('volDbs').value = 'Cleared';
          document.querySelectorAll('.vol-role-checkbox').forEach(cb => cb.checked = false);
          document.getElementById('volunteerModalTitle').textContent = 'Add Volunteer';
        }

        document.getElementById('volunteerModal').style.display = 'flex';
      }

      function saveVolunteer(e) {
        e.preventDefault();
        if (!isAdmin()) return;

        const index = document.getElementById('volEditIndex').value;
        const selectedRoles = Array.from(document.querySelectorAll('.vol-role-checkbox:checked')).map(cb => cb.value).join(', ');

        const volData = {
          Name: document.getElementById('volName').value.trim(),
          Pin: document.getElementById('volPin').value.trim(),
          Roles: selectedRoles || 'Driver',
          'DBS Status': document.getElementById('volDbs').value
        };

        if (index !== '') {
          db.volunteers[index] = volData;
        } else {
          db.volunteers.push(volData);
        }

        saveData('volunteers');
        closeModal('volunteerModal');
        renderVolunteers();
      }

      function deleteVolunteer(index) {
        if (!isAdmin()) return;
        const volName = db.volunteers[index].Name;
        customConfirm("Delete Volunteer", `Are you sure you want to delete volunteer "${volName}"?`, () => {
          db.volunteers.splice(index, 1);
          saveData('volunteers');
          renderVolunteers();
        });
      }

      function renderMaintenance() {
        const canLogMaint = hasMaintenancePermission();

        document.getElementById('content').innerHTML = `
          <div class="page-header">
            <div class="page-title">
              <h2>Maintenance & Fleet</h2>

      function openMaintenanceLogModal(logIndex = null) {
        if (!hasMaintenancePermission()) {
          customAlert("Permission Denied", "Permission Denied: You require the Maintenance permission to log maintenance.");
          return;
        }

        // Populate asset dropdown
        const assetSelect = document.getElementById('maintLogAsset');
        assetSelect.innerHTML = db.fleetItems.map(f => `<option value="${f.name}">${f.name} (${f.type})</option>`).join('');

        // Populate volunteers checklist
        const volContainer = document.getElementById('maintVolunteersList');
        volContainer.innerHTML = db.volunteers.map(v => `
          <label style="display:flex; align-items:center; gap:0.4rem; font-size:0.8rem;">
            <input type="checkbox" value="${v.Name}" class="maint-vol-checkbox"> ${v.Name}
          </label>
        `).join('');

        if (logIndex !== null && isAdmin()) {
          const log = db.maintenanceLogs[logIndex];
          document.getElementById('maintLogEditIndex').value = logIndex;
          assetSelect.value = log.assetName || log.asset;
          document.getElementById('maintWorkDone').value = log.workDone;
          document.getElementById('maintStartDate').value = log.startDate;
          document.getElementById('maintEndDate').value = log.endDate;
          document.getElementById('maintNotes').value = log.notes || '';
          
          const perf = Array.isArray(log.performedBy) ? log.performedBy : [log.performedBy];
          document.querySelectorAll('.maint-vol-checkbox').forEach(cb => {
            cb.checked = perf.includes(cb.value);
          });
          document.getElementById('maintLogModalTitle').textContent = 'Edit Maintenance Log Entry';
        } else {
          document.getElementById('maintLogEditIndex').value = '';
          document.getElementById('maintWorkDone').value = '';
          const today = new Date().toISOString().split('T')[0];
          document.getElementById('maintStartDate').value = today;
          document.getElementById('maintEndDate').value = today;
          document.getElementById('maintNotes').value = '';
          document.querySelectorAll('.maint-vol-checkbox').forEach(cb => cb.checked = false);
          document.getElementById('maintLogModalTitle').textContent = 'Add Maintenance Log Entry';
        }

        document.getElementById('maintLogModal').style.display = 'flex';
      }

      function saveMaintenanceLogEntry(e) {
        e.preventDefault();
        if (!hasMaintenancePermission()) {
          customAlert("Permission Denied", "Permission Denied: Maintenance permission required.");
          return;
        }

        const logIndex = document.getElementById('maintLogEditIndex').value;
        const selectedVolunteers = Array.from(document.querySelectorAll('.maint-vol-checkbox:checked')).map(cb => cb.value);
        
        if (selectedVolunteers.length === 0 && currentUser) {
          selectedVolunteers.push(currentUser.Name);
        }

        const assetName = document.getElementById('maintLogAsset').value;
        const newState = document.getElementById('maintUpdateState').value;

        const logEntry = {
          assetName: assetName,
          workDone: document.getElementById('maintWorkDone').value,
          startDate: document.getElementById('maintStartDate').value,
          endDate: document.getElementById('maintEndDate').value,
          performedBy: selectedVolunteers,
          notes: document.getElementById('maintNotes').value
        };

        if (logIndex !== '' && isAdmin()) {
          db.maintenanceLogs[logIndex] = logEntry;
        } else {
          db.maintenanceLogs.unshift(logEntry);
        }

        if (newState) {
          const fleetItem = db.fleetItems.find(f => f.name === assetName);
          if (fleetItem) {
            fleetItem.state = newState;
            saveData('fleetItems');
          }
        }

        saveData('maintenanceLogs');
        closeModal('maintLogModal');
        renderMaintenance();
      }

      function deleteMaintenanceLog(index) {
        if (!isAdmin()) return;
        customConfirm("Delete Maintenance Log", "Are you sure you want to delete this maintenance entry?", () => {
          db.maintenanceLogs.splice(index, 1);

          renderMaintenance();
        });
      }

      function renderGenericModule(moduleKey, title, fields) {
        const items = db[moduleKey] || [];

        document.getElementById('content').innerHTML = `
          <div class="page-header">
            <div class="page-title">
              <h2>${title}</h2>
              <p>Management section module</p>
            </div>
            <button class="btn btn-primary" onclick="openGenericModal('${moduleKey}', null, '${title}')"><i data-lucide="plus"></i> Add Item</button>
          </div>

            <div class="table-container">
              <table>
                <thead>
                  <tr>
                    ${fields.map(f => `<th>${f}</th>`).join('')}

                  </tr>
                </thead>
                <tbody>
                  ${items.length === 0 ? `<tr><td colspan="${fields.length + 1}" style="text-align:center;">No items added yet.</td></tr>` :
                    items.map((item, index) => `
                      <tr>
                        ${fields.map((f, i) => `<td ${i === 0 ? 'style="font-weight:600;"' : ''}>${item[f] || '-'}</td>`).join('')}
                        <td style="text-align:right;">
                          <button class="btn btn-secondary btn-sm" onclick="openGenericModal('${moduleKey}', ${index}, '${title}')"><i data-lucide="edit"></i></button>
                          <button class="btn btn-danger btn-sm" onclick="deleteGenericItem('${moduleKey}', ${index})"><i data-lucide="trash-2"></i></button>
                        </td>
                      </tr>
                    `).join('')
                  }
                </tbody>
              </table>
            </div>
          </div>
        `;
      }

      function openGenericModal(moduleKey, index = null, title = 'Item') {
        editingModuleKey = moduleKey;
        editingModuleIndex = index;

        let fields = [];
        if (moduleKey === 'assets') fields = ['Name', 'Location', 'Condition', 'Notes'];
        else if (moduleKey === 'stock') fields = ['Item Name', 'Category', 'Quantity', 'Reorder Level'];
        else if (moduleKey === 'suppliers') fields = ['Company Name', 'Contact Person', 'Phone', 'Email', 'Services'];
        else if (moduleKey === 'enquiries') fields = ['Date', 'Sender', 'Subject', 'Status', 'Notes'];
        else if (moduleKey === 'documents') fields = ['Document Title', 'Category', 'Last Revised', 'Status'];
        else if (moduleKey === 'notes') fields = ['Title', 'Author', 'Date', 'Details'];
        else if (moduleKey === 'incidents') fields = ['Asset', 'Description', 'Date', 'Status'];
        else if (moduleKey === 'actions') fields = ['Title', 'Assigned To', 'Due Date', 'Priority'];
        else if (moduleKey === 'events') fields = ['Title', 'Start Date', 'End Date', 'Details'];

        const container = document.getElementById('genericFormFields');
        const item = (index !== null && db[moduleKey]) ? db[moduleKey][index] : {};

        container.innerHTML = fields.map(f => `
          <div class="form-group">
            <label>${f}</label>
            <input type="text" name="${f}" value="${item[f] || ''}" required>
          </div>
        `).join('');

        document.getElementById('genericModalTitle').textContent = `${index !== null ? 'Edit' : 'Add'} ${title}`;
        document.getElementById('genericModal').style.display = 'flex';
      }

      function saveGenericItem(e) {
        e.preventDefault();
        const form = e.target;
        const formData = new FormData(form);
        const itemObj = {};

        for (let [key, val] of formData.entries()) {
          itemObj[key] = val;
        }

        if (!db[editingModuleKey]) db[editingModuleKey] = [];

        if (editingModuleIndex !== null) {
          db[editingModuleKey][editingModuleIndex] = itemObj;
        } else {
          db[editingModuleKey].push(itemObj);
        }

        saveData(editingModuleKey);
        closeModal('genericModal');
        renderApp();
      }

      function deleteGenericItem(moduleKey, index) {
        customConfirm("Delete Item", "Are you sure you want to delete this item?", () => {
          db[moduleKey].splice(index, 1);
          saveData(moduleKey);
          renderApp();
        });
      }

      function openArchiveEditModal(index) {
        if (!isAdmin()) return;
        const arch = db.historicalArchive[index];
        document.getElementById('editArchiveIndex').value = index;
        document.getElementById('editArchiveDateTxt').textContent = arch.date;

        // Inspections populate
        const inspectorSelects = [document.getElementById('editArch_TW_Inspector'), document.getElementById('editArch_TR_Inspector')];
        inspectorSelects.forEach(s => {
          s.innerHTML = `<option value="N/A">N/A</option>` + db.volunteers.map(v => `<option value="${v.Name}">${v.Name}</option>`).join('');
        });

        document.getElementById('editArch_TW_Result').value = arch.trackWalk?.result || 'Not Completed';
        document.getElementById('editArch_TW_Inspector').value = arch.trackWalk?.inspector || 'N/A';
        document.getElementById('editArch_TW_Notes').value = arch.trackWalk?.notes || '';

        document.getElementById('editArch_TR_Result').value = arch.testRun?.result || 'Not Completed';
        document.getElementById('editArch_TR_Inspector').value = arch.testRun?.inspector || 'N/A';

        const locosContainer = document.getElementById('editArch_LocosContainer');
        const runningLocos = arch.runningTrains || [];
        locosContainer.innerHTML = db.fleetItems.map(f => `
          <label style="font-size:0.75rem; display:flex; align-items:center; gap:0.3rem;">
            <input type="checkbox" value="${f.name}" class="arch-loco-cb" ${runningLocos.includes(f.name) ? 'checked' : ''}> ${f.name}
          </label>
        `).join('');

        document.getElementById('editArchiveModal').style.display = 'flex';
      }

      function saveArchiveEdit(e) {
        e.preventDefault();
        if (!isAdmin()) return;

        const index = document.getElementById('editArchiveIndex').value;
        const arch = db.historicalArchive[index];

        const selectedLocos = Array.from(document.querySelectorAll('.arch-loco-cb:checked')).map(cb => cb.value);

        arch.trackWalk = {
          result: document.getElementById('editArch_TW_Result').value,
          inspector: document.getElementById('editArch_TW_Inspector').value,
          notes: document.getElementById('editArch_TW_Notes').value
        };

        arch.testRun = {
          result: document.getElementById('editArch_TR_Result').value,
          inspector: document.getElementById('editArch_TR_Inspector').value
        };

        arch.runningTrains = selectedLocos;

        saveData('historicalArchive');
        closeModal('editArchiveModal');
        renderArchives();
      }

      function deleteArchiveDay(index) {
        if (!isAdmin()) return;
        const dateStr = db.historicalArchive[index].date;
        customConfirm("Delete Archive Record", `Are you sure you want to delete the archive day record for ${dateStr}? This action cannot be undone.`, () => {

      function openLoginModal() {
        const select = document.getElementById('loginUserSelect');
        select.innerHTML = `<option value="">-- Choose Account --</option>` + 
          db.volunteers.map(v => `<option value="${v.Name}">${v.Name} (${v.Roles || 'User'})</option>`).join('');
        document.getElementById('loginUserPin').value = '';
        document.getElementById('loginErrorMsg').style.display = 'none';
        document.getElementById('loginModal').style.display = 'flex';
      }

      function handleUserLogin(e) {
        e.preventDefault();
        const name = document.getElementById('loginUserSelect').value;
        const pin = document.getElementById('loginUserPin').value;

        const vol = db.volunteers.find(v => v.Name === name && v.Pin === pin);
        if (vol) {
          currentUser = vol;
          if (document.getElementById('rememberDeviceCheckbox').checked) {
            localStorage.setItem('evlt_user_name', vol.Name);
          }
          closeModal('loginModal');
          renderApp();
        } else {
          document.getElementById('loginErrorMsg').style.display = 'block';
        }
      }

      function autoLoginSavedUser() {
        const savedName = localStorage.getItem('evlt_user_name');
        if (savedName) {
          const vol = db.volunteers.find(v => v.Name === savedName);
          if (vol) currentUser = vol;
        }
      }

      function closeModal(modalId) {
        document.getElementById(modalId).style.display = 'none';
      }

      window.onload = function() {
        initFirebaseSync();
        autoLoginSavedUser();
        renderApp();
      };
    </script>
