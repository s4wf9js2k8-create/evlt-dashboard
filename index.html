<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>EVLT Operations Platform</title>
        <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
        <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
        <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
        <script src="https://unpkg.com/lucide@latest"></script>
        <style>
    :root { 
      --primary: #1e3a1e; 
      --primary-hover: #152915;
      --primary-light: #f0f4f0;
      --accent: #2d5a2d;
      
      --bg: #f8fafc; 
      --card-bg: #ffffff; 
      --sidebar-bg: #0f172a;
      --sidebar-hover: #1e293b;
      --sidebar-text: #94a3b8;
      --sidebar-text-active: #ffffff;
      
      --text: #0f172a; 
      --text-muted: #64748b;
      --border: #e2e8f0; 
      --border-subtle: #f1f5f9;
      
      --radius-sm: 4px;
      --radius: 6px;
      --radius-lg: 8px;
      
      --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.03);
      --shadow: 0 1px 3px 0 rgb(0 0 0 / 0.06), 0 1px 2px -1px rgb(0 0 0 / 0.04);
      --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.08);
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: var(--font-sans); }
    body { background: var(--bg); color: var(--text); display: flex; flex-direction: column; min-height: 100vh; -webkit-font-smoothing: antialiased; }
    
    header { 
      background: var(--primary); 
      color: white; 
      padding: 0 1.25rem; 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      position: sticky; 
      top: 0; 
      z-index: 1001; 
      height: 56px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }
    .header-left { display: flex; align-items: center; gap: 0.85rem; }
    
    .header-logo { width: 38px; height: 38px; flex-shrink: 0; display: block; }
    .brand-title { display: flex; align-items: center; gap: 0.65rem; font-weight: 600; font-size: 1rem; letter-spacing: -0.01em; color: #ffffff; }
    .brand-badge { font-size: 0.65rem; text-transform: uppercase; font-weight: 700; letter-spacing: 0.05em; background: rgba(255,255,255,0.15); padding: 2px 6px; border-radius: 3px; color: #f1f5f9; }
    
    .menu-btn { display: none; background: none; border: none; color: white; cursor: pointer; padding: 0.25rem; border-radius: var(--radius-sm); }
    .menu-btn:hover { background: rgba(255,255,255,0.1); }
    
    .app-container { display: flex; flex: 1; position: relative; }
    
    sidebar { 
      width: 230px; 
      background: var(--sidebar-bg); 
      color: var(--sidebar-text); 
      padding: 0.85rem 0.65rem; 
      flex-shrink: 0; 
      display: flex;
      flex-direction: column;
      gap: 0.15rem;
      transition: transform 0.2s ease; 
      overflow-y: auto;
      max-height: calc(100vh - 56px);
      border-right: 1px solid var(--border);
    }
    .sidebar-section-label { font-size: 0.65rem; text-transform: uppercase; font-weight: 700; letter-spacing: 0.08em; color: #64748b; padding: 0.65rem 0.65rem 0.25rem 0.65rem; }
    sidebar a { 
      display: flex; 
      align-items: center; 
      gap: 0.65rem; 
      padding: 0.5rem 0.65rem; 
      color: var(--sidebar-text); 
      text-decoration: none; 
      font-weight: 500; 
      font-size: 0.85rem; 
      border-radius: var(--radius-sm);
      transition: background 0.15s ease, color 0.15s ease;
    }
    sidebar a:hover { background: var(--sidebar-hover); color: var(--sidebar-text-active); }
    sidebar a.active { background: var(--primary); color: var(--sidebar-text-active); font-weight: 600; }
    sidebar a i { width: 16px; height: 16px; opacity: 0.85; }
    
    .overlay { display: none; position: fixed; inset: 0; background: rgba(15, 23, 42, 0.4); backdrop-filter: blur(2px); z-index: 999; }
    
    main { flex: 1; padding: 1.5rem 2rem; max-width: 1300px; width: 100%; margin: 0 auto; min-width: 0; }
    
    .page-header { display: flex; justify-content: space-between; align-items: flex-end; gap: 1rem; margin-bottom: 1.5rem; border-bottom: 1px solid var(--border); padding-bottom: 0.85rem; }
    .page-title h2 { font-size: 1.35rem; font-weight: 700; color: var(--text); letter-spacing: -0.02em; line-height: 1.2; }
    .page-title p { font-size: 0.825rem; color: var(--text-muted); margin-top: 0.2rem; }
    
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 0.4rem; padding: 0.45rem 0.85rem; border-radius: var(--radius); font-size: 0.825rem; font-weight: 600; cursor: pointer; border: 1px solid transparent; transition: all 0.15s ease; white-space: nowrap; }
    .btn i { width: 15px; height: 15px; }
    .btn-primary { background: var(--primary); color: white; border-color: var(--primary); }
    .btn-primary:hover { background: var(--primary-hover); border-color: var(--primary-hover); }
    .btn-secondary { background: white; border-color: var(--border); color: var(--text); }
    .btn-secondary:hover { background: var(--bg); border-color: #cbd5e1; }
    .btn-subtle { background: transparent; border-color: transparent; color: var(--text-muted); padding: 0.3rem 0.5rem; }
    .btn-subtle:hover { background: var(--border-subtle); color: var(--text); }
    .btn-sm { padding: 0.3rem 0.6rem; font-size: 0.775rem; }

    .section-group { margin-bottom: 2rem; }
    .section-header { font-size: 0.9rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 0.75rem; display: flex; align-items: center; gap: 0.5rem; }
    .section-header::after { content: ''; flex: 1; height: 1px; background: var(--border); }

    .grid-stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 1rem; margin-bottom: 1.5rem; }
    .stat-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 1rem 1.15rem; box-shadow: var(--shadow-sm); cursor: pointer; transition: border-color 0.15s ease; display: flex; flex-direction: column; justify-content: space-between; }
    .stat-card:hover { border-color: var(--primary); }
    .stat-header { display: flex; align-items: center; justify-content: space-between; color: var(--text-muted); font-size: 0.8rem; font-weight: 600; }
    .stat-icon { width: 32px; height: 32px; border-radius: var(--radius-sm); background: var(--primary-light); color: var(--primary); display: flex; align-items: center; justify-content: center; }
    .stat-icon i { width: 16px; height: 16px; }
    .stat-value { font-size: 1.5rem; font-weight: 700; color: var(--text); letter-spacing: -0.02em; margin-top: 0.5rem; }

    /* Daily Operational Checks Styling */
    .checks-table { width: 100%; border-collapse: collapse; }
    .checks-row { cursor: pointer; transition: background 0.15s ease; }
    .checks-row:hover { background: #f1f5f9 !important; }
    .result-badge { display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 28px; border-radius: 50%; color: white; font-weight: 700; }
    .result-pass { background: #16a34a; }
    .result-fail { background: #dc2626; }
    .result-none { background: #cbd5e1; color: #475569; }
    .train-tag { display: inline-block; background: #e2e8f0; color: #1e293b; padding: 2px 8px; border-radius: 12px; font-size: 0.725rem; font-weight: 600; margin-right: 4px; margin-top: 2px; }
    .train-disabled { opacity: 0.5; text-decoration: line-through; cursor: not-allowed; background: #fee2e2; color: #991b1b; }
    .fail-reason { color: #dc2626; font-weight: 600; font-size: 0.8rem; }

    .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius-lg); box-shadow: var(--shadow-sm); overflow: hidden; }
    .table-container { width: 100%; overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 0.825rem; text-align: left; }
    th { background: #f8fafc; font-weight: 600; color: var(--text-muted); padding: 0.65rem 0.85rem; border-bottom: 1px solid var(--border); font-size: 0.725rem; text-transform: uppercase; letter-spacing: 0.04em; }
    td { padding: 0.75rem 0.85rem; border-bottom: 1px solid var(--border-subtle); color: var(--text); vertical-align: middle; }
    tbody tr:last-child td { border-bottom: none; }
    tbody tr:hover { background: #f8fafc; }

    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(15, 23, 42, 0.4); backdrop-filter: blur(2px); justify-content: center; align-items: center; z-index: 1100; padding: 1rem; }
    .modal { background: white; padding: 1.5rem; border-radius: var(--radius-lg); width: 100%; max-width: 500px; max-height: 85vh; overflow-y: auto; box-shadow: var(--shadow-lg); border: 1px solid var(--border); }
    .modal h3 { font-size: 1.05rem; font-weight: 700; color: var(--text); margin-bottom: 1rem; border-bottom: 1px solid var(--border); padding-bottom: 0.65rem; }
    .form-group { margin-bottom: 0.85rem; }
    .form-group label { display: block; font-size: 0.775rem; font-weight: 600; margin-bottom: 0.25rem; color: var(--text); }
    .form-group input, .form-group textarea, .form-group select { width: 100%; padding: 0.5rem 0.65rem; border: 1px solid var(--border); border-radius: var(--radius); font-size: 0.825rem; outline: none; background: white; transition: border-color 0.15s; }
    .checkbox-group { display: flex; flex-direction: column; gap: 0.4rem; border: 1px solid var(--border); padding: 0.65rem; border-radius: var(--radius); background: #f8fafc; }
    .checkbox-group label { display: flex; align-items: center; gap: 0.4rem; font-size: 0.8rem; font-weight: 400; cursor: pointer; }
    .checkbox-group input[type="checkbox"] { width: auto; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 0.5rem; margin-top: 1.25rem; border-top: 1px solid var(--border); padding-top: 0.85rem; }

    .preview-thumb { width: 100%; max-height: 120px; object-fit: cover; border-radius: var(--radius); margin-top: 0.5rem; border: 1px solid var(--border); }
    .badge-out-of-service { background: #fee2e2; color: #991b1b; padding: 2px 6px; border-radius: 4px; font-weight: 700; font-size: 0.7rem; text-transform: uppercase; }

    @media (max-width: 768px) {
      .menu-btn { display: block; }
      sidebar { position: fixed; top: 56px; left: 0; bottom: 0; height: calc(100vh - 56px); z-index: 1000; transform: translateX(-100%); width: 230px; padding-top: 0.85rem; }
      sidebar.active { transform: translateX(0); }
      .overlay.active { display: block; }
      main { padding: 1rem; }
      .page-header { flex-direction: column; align-items: flex-start; gap: 0.75rem; }
    }
  </style>
      </head>
      <body>
        <header>
          <div class="header-left">
            <button class="menu-btn" onclick="toggleMenu()" aria-label="Toggle navigation menu">
              <i data-lucide="menu">
              </i>
            </button>
            <svg class="header-logo" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
              <circle cx="50" cy="50" r="48" fill="#fcf8ee" stroke="#1e3a1e" stroke-width="4"/>
              <defs>
                <path id="topArc" d="M 15,50 A 35,35 0 0,1 85,50" />
                <path id="bottomArc" d="M 85,50 A 35,35 0 0,1 15,50" />
              </defs>
              <text font-family="-apple-system, sans-serif" font-size="8.5" font-weight="bold" fill="#1e3a1e">
                <textPath href="#topArc" startOffset="50%" text-anchor="middle">WHEELS OF TIME</textPath>
              </text>
              <text font-family="-apple-system, sans-serif" font-size="7" font-weight="bold" fill="#1e3a1e">
                <textPath href="#bottomArc" startOffset="50%" text-anchor="middle">RAILWAY MUSEUM</textPath>
              </text>
              <rect x="20" y="38" width="60" height="24" rx="12" fill="#1e3a1e"/>
              <rect x="22" y="40" width="56" height="20" rx="10" fill="#fcf8ee"/>
              <text x="50" y="49" font-family="serif" font-size="6.5" font-weight="bold" fill="#1e3a1e" text-anchor="middle">ELHAM VALLEY</text>
              <text x="50" y="56" font-family="-apple-system, sans-serif" font-size="4" font-weight="bold" fill="#1e3a1e" text-anchor="middle">LINE TRUST</text>
            </svg>
            <div class="brand-title">
              <span>EVLT Operations Platform</span>
              <span class="brand-badge">Admin</span>
            </div>
          </div>
          <div>
            <input type="file" id="excelFileInput" accept=".xlsx, .xls" style="display: none;" onchange="importExcel(event)">
              <button class="btn btn-secondary btn-sm" onclick="document.getElementById('excelFileInput').click()">
                <i data-lucide="upload">
                </i> Import Excel
              </button>
            </div>
          </header>
          <div class="overlay" id="overlay" onclick="toggleMenu()">
          </div>
          <div class="app-container">
            <sidebar id="sidebar">
              <div class="sidebar-section-label">Main</div>
              <a href="#" class="active" onclick="navigate('dashboard')">
                <i data-lucide="layout-dashboard">
                </i> Dashboard</a>
                <a href="#" onclick="navigate('clock')">
                  <i data-lucide="clock">
                  </i> Clock In/Out</a>
                  <a href="#" onclick="navigate('calendar')">
                    <i data-lucide="calendar">
                    </i> Attendance & Hours</a>
                    <div class="sidebar-section-label">Safety & Competency</div>
                    <a href="#" onclick="navigate('incidents')">
                      <i data-lucide="alert-triangle">
                      </i> Incident & Defect Log</a>
                      <a href="#" onclick="navigate('competency')">
                        <i data-lucide="award">
                        </i> Qualifications Matrix</a>
                        <div class="sidebar-section-label">Operations</div>
                        <a href="#" onclick="navigate('volunteers')">
                          <i data-lucide="users">
                          </i> Volunteers</a>
                          <a href="#" onclick="navigate('actions')">
                            <i data-lucide="check-square">
                            </i> Actions</a>
                            <a href="#" onclick="navigate('maintenance')">
                              <i data-lucide="wrench">
                              </i> Maintenance</a>
                              <a href="#" onclick="navigate('events')">
                                <i data-lucide="calendar-range">
                                </i> Events</a>
                                <div class="sidebar-section-label">Management</div>
                                <a href="#" onclick="navigate('assets')">
                                  <i data-lucide="box">
                                  </i> Assets</a>
                                  <a href="#" onclick="navigate('stock')">
                                    <i data-lucide="package">
                                    </i> Stock</a>
                                    <a href="#" onclick="navigate('suppliers')">
                                      <i data-lucide="truck">
                                      </i> Suppliers</a>
                                      <a href="#" onclick="navigate('enquiries')">
                                        <i data-lucide="help-circle">
                                        </i> Enquiries</a>
                                        <a href="#" onclick="navigate('documents')">
                                          <i data-lucide="file-text">
                                          </i> Documents</a>
                                          <a href="#" onclick="navigate('notes')">
                                            <i data-lucide="sticky-note">
                                            </i> Notes</a>
                                          </sidebar>
                                          <main id="content">
                                          </main>
                                        </div>
                                        <div class="modal-overlay" id="opCheckModal">
                                          <div class="modal">
                                            <h3 id="opCheckTitle">Log Inspection Check</h3>
                                            <form onsubmit="saveOpCheck(event)">
                                              <input type="hidden" id="opCheckKey" value="">
                                                <div class="form-group">
                                                  <label>Inspected By (Volunteer)</label>
                                                  <select id="opCheckInspector" required>
                                                  </select>
                                                </div>
                                                <div class="form-group">
                                                  <label>Inspection Outcome</label>
                                                  <select id="opCheckResult" required onchange="toggleOpCheckReason(this.value)">
                                                    <option value="Pass">Positive (Pass)</option>
                                                    <option value="Fail">Negative (Fail)</option>
                                                  </select>
                                                </div>
                                                <div class="form-group" id="reasonSelectionGroup" style="display: none;">
                                                  <label id="reasonLabel">Reason for Failure</label>
                                                  <textarea id="opCheckReason" rows="3" placeholder="Specify failure reason or defect...">
                                                  </textarea>
                                                </div>
                                                <div class="form-group" id="trainSelectionGroup">
                                                  <label>Locomotives Used (Select all running)</label>
                                                  <div class="checkbox-group" id="trainCheckboxes">
                                                  </div>
                                                </div>
                                                <div class="modal-actions">
                                                  <button type="button" class="btn btn-secondary" onclick="closeModal('opCheckModal')">Cancel</button>
                                                  <button type="submit" class="btn btn-primary">Save Check</button>
                                                </div>
                                              </form>
                                            </div>
                                          </div>
                                          <div class="modal-overlay" id="incidentModal">
                                            <div class="modal">
                                              <h3>Log Incident / Defect</h3>
                                              <form onsubmit="saveIncident(event)">
                                                <div class="form-group">
                                                  <label>Asset / Locomotive / Location</label>
                                                  <input type="text" id="incidentAsset" placeholder="e.g. Canadian Pacific, North Turnout" required>
                                                  </div>
                                                  <div class="form-group">
                                                    <label>Defect Description</label>
                                                    <textarea id="incidentDesc" rows="3" placeholder="Describe the issue or defect..." required>
                                                    </textarea>
                                                  </div>
                                                  <div class="form-group">
                                                    <label>Red Tag Status (Out of Service)</label>
                                                    <select id="incidentRedTag">
                                                      <option value="Operational">Operational (Minor Issue)</option>
                                                      <option value="Out of Service">Out of Service (LOCKOUT / RED TAG)</option>
                                                    </select>
                                                  </div>
                                                  <div class="form-group">
                                                    <label>Defect Photo (Optional)</label>
                                                    <input type="file" id="incidentPhoto" accept="image/*" onchange="previewIncidentPhoto(event)">
                                                      <img id="incidentPhotoPreview" class="preview-thumb" style="display:none;" />
                                                    </div>
                                                    <div class="modal-actions">
                                                      <button type="button" class="btn btn-secondary" onclick="closeModal('incidentModal')">Cancel</button>
                                                      <button type="submit" class="btn btn-primary">Report Defect</button>
                                                    </div>
                                                  </form>
                                                </div>
                                              </div>
                                              <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAX79ysaODygo5BqzbVLN6fYWMx-PXg-AMY",
      authDomain: "evlt-admin.firebaseapp.com",
      databaseURL: "https://evlt-admin-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "evlt-admin",
      storageBucket: "evlt-admin.firebasestorage.app",
      messagingSenderId: "603418741774",
      appId: "1:603418741774:web:b9d4717f3d-c4a3ede5805f"
    };

    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    let db = {};
    let currentView = 'dashboard';
    let tempPhotoBase64 = '';

    const AVAILABLE_TRAINS = ["Canadian Pacific", "DB", "Santa Fe", "George", "Edward", "Dylan"];

    function getTodayString() {
      const today = new Date();
      return today.toISOString().split('T')[0]; // Format: YYYY-MM-DD
    }

    database.ref('EVLT_ADMIN_DB').on('value', (snapshot) => {
      db = snapshot.val() || {};
      if (!db.clockLogs) db.clockLogs = [];
      if (!db.incidents) db.incidents = [];

      // AUTOMATIC DAILY RESET CHECK
      const todayStr = getTodayString();
      if (!db.dailyChecks || db.dailyChecks.lastCheckDate !== todayStr) {
        db.dailyChecks = {
          lastCheckDate: todayStr,
          trackWalk: { inspector: '', result: '', notes: '', trains: [] },
          testRun: { inspector: '', result: '', notes: '', trains: [] }
        };
        database.ref('EVLT_ADMIN_DB/dailyChecks').set(db.dailyChecks);
      }

      navigate(currentView);
    });

    function toggleMenu() {
      document.getElementById('sidebar').classList.toggle('active');
      document.getElementById('overlay').classList.toggle('active');
    }

    function getVolunteerName(v) {
      return v.Name || v.name || v['Volunteer Name'] || v['Volunteer ID'] || 'Unknown';
    }

    function getRedTaggedAssets() {
      return (db.incidents || [])
        .filter(i => String(i['Red Tag Status']).toLowerCase() === 'out of service' && String(i.Status).toLowerCase() !== 'resolved')
        .map(i => String(i['Asset / Location'] || i.asset || '').toLowerCase());
    }

    function openOpCheckModal(checkKey) {
      const checkData = (db.dailyChecks && db.dailyChecks[checkKey]) ? db.dailyChecks[checkKey] : { inspector: '', result: 'Pass', notes: '', trains: [] };
      document.getElementById('opCheckKey').value = checkKey;
      document.getElementById('opCheckTitle').innerText = checkKey === 'trackWalk' ? 'Log Track Walk' : 'Log Test Run';

      const volunteers = db.volunteers || [];
      const inspectorSelect = document.getElementById('opCheckInspector');
      inspectorSelect.innerHTML = '<option value="">-- Select Volunteer --</option>' + 
        volunteers.map(v => {
          const name = getVolunteerName(v);
          return `<option value="${name}" ${checkData.inspector === name ? 'selected' : ''}>${name}</option>`;
        }).join('');

      const resultVal = checkData.result || 'Pass';
      document.getElementById('opCheckResult').value = resultVal;
      document.getElementById('opCheckReason').value = checkData.notes || '';
      toggleOpCheckReason(resultVal);

      const trainGroup = document.getElementById('trainSelectionGroup');
      if (checkKey === 'testRun') {
        trainGroup.style.display = 'block';
        const redTagged = getRedTaggedAssets();

        const trainsContainer = document.getElementById('trainCheckboxes');
        const activeTrains = checkData.trains || [];

        trainsContainer.innerHTML = AVAILABLE_TRAINS.map(train => {
          const isRedTagged = redTagged.some(rt => rt.includes(train.toLowerCase()));
          return `
            <label class="${isRedTagged ? 'train-disabled' : ''}">
              <input type="checkbox" name="trainCheck" value="${train}" 
                ${activeTrains.includes(train) ? 'checked' : ''} 
                ${isRedTagged ? 'disabled' : ''}>
              ${train} ${isRedTagged ? '(RED TAGGED - OUT OF SERVICE)' : ''}
            </label>
          `;
        }).join('');
      } else {
        trainGroup.style.display = 'none';
      }

      document.getElementById('opCheckModal').style.display = 'flex';
      lucide.createIcons();
    }

    function saveOpCheck(e) {
      e.preventDefault();
      const checkKey = document.getElementById('opCheckKey').value;
      const inspector = document.getElementById('opCheckInspector').value;
      const result = document.getElementById('opCheckResult').value;
      const notes = document.getElementById('opCheckReason').value;
      
      const selectedTrains = [];
      if (checkKey === 'testRun') {
        document.querySelectorAll('input[name="trainCheck"]:checked').forEach(cb => selectedTrains.push(cb.value));
      }

      if (!db.dailyChecks) db.dailyChecks = {};
      db.dailyChecks.lastCheckDate = getTodayString();
      db.dailyChecks[checkKey] = { inspector, result, notes, trains: selectedTrains };

      database.ref('EVLT_ADMIN_DB/dailyChecks').set(db.dailyChecks);
      closeModal('opCheckModal');
      renderDashboard();
    }

    function toggleOpCheckReason(resultVal) {
      const reasonGroup = document.getElementById('reasonSelectionGroup');
      const reasonInput = document.getElementById('opCheckReason');
      if (resultVal === 'Fail') {
        reasonGroup.style.display = 'block';
        reasonInput.required = true;
      } else {
        reasonGroup.style.display = 'none';
        reasonInput.required = false;
      }
    }

    /* Incidents & Red-Tagging Functions */
    function openIncidentModal() {
      tempPhotoBase64 = '';
      document.getElementById('incidentAsset').value = '';
      document.getElementById('incidentDesc').value = '';
      document.getElementById('incidentRedTag').value = 'Operational';
      document.getElementById('incidentPhoto').value = '';
      document.getElementById('incidentPhotoPreview').style.display = 'none';
      document.getElementById('incidentModal').style.display = 'flex';
    }

    function previewIncidentPhoto(e) {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(evt) {
          tempPhotoBase64 = evt.target.result;
          const img = document.getElementById('incidentPhotoPreview');
          img.src = tempPhotoBase64;
          img.style.display = 'block';
        };
        reader.readAsDataURL(file);
      }
    }

    function saveIncident(e) {
      e.preventDefault();
      const asset = document.getElementById('incidentAsset').value;
      const desc = document.getElementById('incidentDesc').value;
      const redTag = document.getElementById('incidentRedTag').value;

      const newIncident = {
        id: Date.now(),
        'Asset / Location': asset,
        Description: desc,
        'Red Tag Status': redTag,
        Status: 'Open',
        Date: new Date().toLocaleDateString('en-GB'),
        Photo: tempPhotoBase64
      };

      if (!db.incidents) db.incidents = [];
      db.incidents.push(newIncident);

      database.ref('EVLT_ADMIN_DB/incidents').set(db.incidents);
      closeModal('incidentModal');
      if (currentView === 'incidents') renderIncidents();
      else renderDashboard();
    }

    function resolveIncident(idx) {
      if (db.incidents && db.incidents[idx]) {
        db.incidents[idx].Status = 'Resolved';
        database.ref(`EVLT_ADMIN_DB/incidents/${idx}`).set(db.incidents[idx]);
        renderIncidents();
      }
    }

    function renderDashboard() {
      const content = document.getElementById('content');
      const activeClockIns = (db.clockLogs || []).filter(l => l.status === 'Clocked In').length;
      const openIncidents = (db.incidents || []).filter(i => String(i.Status).toLowerCase() !== 'resolved').length;
      const pendingMaintenance = (db.maintenance || []).filter(m => String(m.Status || m.status).toLowerCase() !== 'completed').length;

      const daily = db.dailyChecks || { trackWalk: {}, testRun: {} };

      const renderResultIcon = (res) => {
        if (res === 'Pass') return '<div class="result-badge result-pass"><i data-lucide="check" style="width:16px;height:16px;"></i></div>';
        if (res === 'Fail') return '<div class="result-badge result-fail"><i data-lucide="x" style="width:16px;height:16px;"></i></div>';
        return '<div class="result-badge result-none">-</div>';
      };

      content.innerHTML = `
        <div class="page-header">
          <div class="page-title">
            <h2>Operations Dashboard</h2>
            <p>Railway daily safety inspections and site activity overview (${getTodayString()}).</p>
          </div>
          <button class="btn btn-primary btn-sm" onclick="openIncidentModal()">
            <i data-lucide="alert-triangle"></i> Report Defect / Red Tag
          </button>
        </div>

        <div class="section-group">
          <div class="section-header">Daily Safety Inspections (Resets Daily)</div>
          <div class="card">
            <div class="table-container">
              <table class="checks-table">
                <thead>
                  <tr>
                    <th>Check Type</th>
                    <th>Inspected By</th>
                    <th style="text-align:center;">Result</th>
                    <th>Notes / Running Locos</th>
                    <th style="text-align:right;">Action</th>
                  </tr>
                </thead>
                <tbody>
                  <tr class="checks-row" onclick="openOpCheckModal('trackWalk')">
                    <td><strong>Track Walk</strong></td>
                    <td>${daily.trackWalk?.inspector || '<span style="color:var(--text-muted);">Unassigned</span>'}</td>
                    <td style="text-align:center;">${renderResultIcon(daily.trackWalk?.result)}</td>
                    <td>${daily.trackWalk?.result === 'Fail' ? `<span class="fail-reason">Reason: ${daily.trackWalk.notes || 'None'}</span>` : '<em style="color:var(--text-muted); font-size:0.8rem;">Completed on foot</em>'}</td>
                    <td style="text-align:right;"><button class="btn btn-subtle btn-sm"><i data-lucide="edit-2"></i> Edit</button></td>
                  </tr>
                  <tr class="checks-row" onclick="openOpCheckModal('testRun')">
                    <td><strong>Test Run</strong></td>
                    <td>${daily.testRun?.inspector || '<span style="color:var(--text-muted);">Unassigned</span>'}</td>
                    <td style="text-align:center;">${renderResultIcon(daily.testRun?.result)}</td>
                    <td>
                      ${(daily.testRun?.trains || []).map(t => `<span class="train-tag">${t}</span>`).join('') || '<span style="color:var(--text-muted); font-size:0.8rem;">No trains set</span>'}
                      ${daily.testRun?.result === 'Fail' ? `<div class="fail-reason">Reason: ${daily.testRun.notes}</div>` : ''}
                    </td>
                    <td style="text-align:right;"><button class="btn btn-subtle btn-sm"><i data-lucide="edit-2"></i> Edit</button></td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>

        <div class="section-group">
          <div class="section-header">Operational Summary</div>
          <div class="grid-stats">
            <div class="stat-card" onclick="navigate('clock')">
              <div class="stat-header"><span>On Site Now</span><div class="stat-icon"><i data-lucide="clock"></i></div></div>
              <div class="stat-value">${activeClockIns}</div>
            </div>
            <div class="stat-card" onclick="navigate('incidents')">
              <div class="stat-header"><span>Open Defects / Hazards</span><div class="stat-icon"><i data-lucide="alert-triangle"></i></div></div>
              <div class="stat-value">${openIncidents}</div>
            </div>
            <div class="stat-card" onclick="navigate('maintenance')">
              <div class="stat-header"><span>Pending Maintenance</span><div class="stat-icon"><i data-lucide="wrench"></i></div></div>
              <div class="stat-value">${pendingMaintenance}</div>
            </div>
            <div class="stat-card" onclick="navigate('volunteers')">
              <div class="stat-header"><span>Registered Volunteers</span><div class="stat-icon"><i data-lucide="users"></i></div></div>
              <div class="stat-value">${(db.volunteers || []).length}</div>
            </div>
          </div>
        </div>`;
    }

    function renderIncidents() {
      const content = document.getElementById('content');
      const incidents = db.incidents || [];

      content.innerHTML = `
        <div class="page-header">
          <div class="page-title">
            <h2>Incident & Defect Log</h2>
            <p>Track defects, photos, and lock out out-of-service equipment.</p>
          </div>
          <button class="btn btn-primary" onclick="openIncidentModal()">
            <i data-lucide="plus"></i> Report Defect
          </button>
        </div>

        <div class="card">
          <div class="table-container">
            <table>
              <thead>
                <tr>
                  <th>Date</th>
                  <th>Asset / Location</th>
                  <th>Description</th>
                  <th>Red Tag Status</th>
                  <th>Photo</th>
                  <th>Status</th>
                  <th style="text-align:right;">Action</th>
                </tr>
              </thead>
              <tbody>
                ${incidents.length === 0 ? `
                  <tr><td colspan="7"><div style="padding:1.5rem; text-align:center; color:var(--text-muted);">No defects logged</div></td></tr>` :
                  incidents.map((i, idx) => `
                    <tr>
                      <td>${i.Date || '-'}</td>
                      <td><strong>${i['Asset / Location'] || i.asset || 'Unknown'}</strong></td>
                      <td>${i.Description || i.desc || '-'}</td>
                      <td>
                        ${i['Red Tag Status'] === 'Out of Service' 
                          ? '<span class="badge-out-of-service">Out of Service</span>' 
                          : '<span style="color:#16a34a; font-weight:600; font-size:0.75rem;">Operational</span>'}
                      </td>
                      <td>${i.Photo ? `<a href="${i.Photo}" target="_blank" style="color:var(--primary); font-weight:600;">View Photo</a>` : '-'}</td>
                      <td><strong>${i.Status || 'Open'}</strong></td>
                      <td style="text-align:right;">
                        ${i.Status !== 'Resolved' ? `<button class="btn btn-subtle btn-sm" onclick="resolveIncident(${idx})"><i data-lucide="check-circle"></i> Resolve</button>` : '<span style="color:var(--text-muted);">Resolved</span>'}
                      </td>
                    </tr>
                  `).join('')}
              </tbody>
            </table>
          </div>
        </div>`;
    }

    function renderCompetencyMatrix() {
      const content = document.getElementById('content');
      const volunteers = db.volunteers || [];

      content.innerHTML = `
        <div class="page-header">
          <div class="page-title">
            <h2>Qualifications & Competency Matrix</h2>
            <p>Line clearing sign-offs, duty qualifications, and emergency contact details.</p>
          </div>
        </div>

        <div class="card">
          <div class="table-container">
            <table>
              <thead>
                <tr>
                  <th>Volunteer Name</th>
                  <th>Roles</th>
                  <th>Driver Qualified</th>
                  <th>Guard Qualified</th>
                  <th>Emergency Contact</th>
                </tr>
              </thead>
              <tbody>
                ${volunteers.length === 0 ? `
                  <tr><td colspan="5"><div style="padding:1.5rem; text-align:center; color:var(--text-muted);">No volunteer qualifications found</div></td></tr>` :
                  volunteers.map(v => `
                    <tr>
                      <td><strong>${getVolunteerName(v)}</strong></td>
                      <td>${v.Roles || v.roles || '-'}</td>
                      <td>${v['Driver Qualified'] || 'No'}</td>
                      <td>${v['Guard Qualified'] || 'No'}</td>
                      <td>${v['Emergency Contact'] ? `<a href="tel:${v['Emergency Contact']}">${v['Emergency Contact']}</a>` : '-'}</td>
                    </tr>
                  `).join('')}
              </tbody>
            </table>
          </div>
        </div>`;
    }

    function navigate(view) {
      currentView = view;
      document.querySelectorAll('sidebar a').forEach(a => a.classList.remove('active'));
      const activeLink = document.querySelector(`sidebar a[onclick="navigate('${view}')"]`);
      if (activeLink) activeLink.classList.add('active');

      if (document.getElementById('sidebar').classList.contains('active')) toggleMenu();

      if (view === 'dashboard') renderDashboard();
      else if (view === 'incidents') renderIncidents();
      else if (view === 'competency') renderCompetencyMatrix();
      
      lucide.createIcons();
    }

    function closeModal(modalId) { document.getElementById(modalId).style.display = 'none'; }

    window.onload = () => { navigate('dashboard'); };
  </script>
                                            </body>
                                          </html>
