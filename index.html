<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EVLT Operations Platform</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
      :root { 
        --primary: #1e3a1e; 
        --primary-hover: #152915;
        --primary-light: #f0f4f0;
        --accent: #2d5a2d;
        
        --bg: #f8fafc; 
        --card-bg: #ffffff; 
        --sidebar-bg: #0f172a;
        --sidebar-hover: #1e293b;
        --sidebar-text: #94a3b8;
        --sidebar-text-active: #ffffff;
        
        --text: #0f172a; 
        --text-muted: #64748b;
        --border: #e2e8f0; 
        --border-subtle: #f1f5f9;
        
        --radius-sm: 4px;
        --radius: 6px;
        --radius-lg: 8px;
        
        --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.03);
        --shadow: 0 1px 3px 0 rgb(0 0 0 / 0.06), 0 1px 2px -1px rgb(0 0 0 / 0.04);
        --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.08);
        --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      }

      * { box-sizing: border-box; margin: 0; padding: 0; font-family: var(--font-sans); }
      body { background: var(--bg); color: var(--text); display: flex; flex-direction: column; min-height: 100vh; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
      
      header { 
        background: var(--primary); 
        color: white; 
        padding: 0 1rem; 
        display: flex; 
        justify-content: space-between; 
        align-items: center; 
        position: sticky; 
        top: 0; 
        z-index: 1001; 
        height: 56px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        width: 100%;
      }
      .header-left { display: flex; align-items: center; gap: 0.6rem; min-width: 0; }
      .header-right { display: flex; align-items: center; gap: 1rem; }
      
      .header-logo { width: 34px; height: 34px; flex-shrink: 0; display: block; }
      .brand-title { display: flex; align-items: center; gap: 0.5rem; font-weight: 600; font-size: 0.9rem; letter-spacing: -0.01em; color: #ffffff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      
      .menu-btn { display: none; background: none; border: none; color: white; cursor: pointer; padding: 0.25rem; border-radius: var(--radius-sm); flex-shrink: 0; }
      .menu-btn:hover { background: rgba(255,255,255,0.1); }
      
      .user-select-container { display: flex; align-items: center; gap: 0.5rem; background: rgba(255,255,255,0.1); padding: 0.25rem 0.5rem; border-radius: var(--radius-sm); border: 1px solid rgba(255,255,255,0.2); font-size: 0.8rem; font-weight: 600; color: #fff; }

      .app-container { display: flex; flex: 1; position: relative; width: 100%; }
      
      sidebar { 
        width: 230px; 
        background: var(--sidebar-bg); 
        color: var(--sidebar-text); 
        padding: 0.85rem 0.65rem 4rem 0.65rem; 
        flex-shrink: 0; 
        display: flex;
        flex-direction: column;
        gap: 0.15rem;
        transition: transform 0.2s ease; 
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        max-height: calc(100vh - 56px);
        border-right: 1px solid var(--border);
      }
      .sidebar-section-label { font-size: 0.65rem; text-transform: uppercase; font-weight: 700; letter-spacing: 0.08em; color: #64748b; padding: 0.65rem 0.65rem 0.25rem 0.65rem; }
      sidebar a { 
        display: flex; 
        align-items: center; 
        gap: 0.65rem; 
        padding: 0.5rem 0.65rem; 
        color: var(--sidebar-text); 
        text-decoration: none; 
        font-weight: 500; 
        font-size: 0.85rem; 
        border-radius: var(--radius-sm);
        transition: background 0.15s ease, color 0.15s ease;
      }
      sidebar a:hover { background: var(--sidebar-hover); color: var(--sidebar-text-active); }
      sidebar a.active { background: var(--primary); color: var(--sidebar-text-active); font-weight: 600; }
      sidebar a i { width: 16px; height: 16px; opacity: 0.85; flex-shrink: 0; }
      
      .overlay { display: none; position: fixed; inset: 0; background: rgba(15, 23, 42, 0.4); backdrop-filter: blur(2px); z-index: 999; }
      
      main { flex: 1; padding: 1.25rem 1.5rem; max-width: 1300px; width: 100%; margin: 0 auto; min-width: 0; overflow-x: hidden; }
      
      .page-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 1rem; margin-bottom: 1.25rem; border-bottom: 1px solid var(--border); padding-bottom: 0.75rem; flex-wrap: wrap; }
      .page-title h2 { font-size: 1.25rem; font-weight: 700; color: var(--text); letter-spacing: -0.02em; line-height: 1.2; }
      .page-title p { font-size: 0.8rem; color: var(--text-muted); margin-top: 0.2rem; }
      
      .btn { display: inline-flex; align-items: center; justify-content: center; gap: 0.4rem; padding: 0.45rem 0.85rem; border-radius: var(--radius); font-size: 0.825rem; font-weight: 600; cursor: pointer; border: 1px solid transparent; transition: all 0.15s ease; white-space: nowrap; }
      .btn i { width: 15px; height: 15px; flex-shrink: 0; }
      .btn-primary { background: var(--primary); color: white; border-color: var(--primary); }
      .btn-primary:hover { background: var(--primary-hover); border-color: var(--primary-hover); }
      .btn-secondary { background: white; border-color: var(--border); color: var(--text); }
      .btn-secondary:hover { background: var(--bg); border-color: #cbd5e1; }
      .btn-subtle { background: transparent; border-color: transparent; color: var(--text-muted); padding: 0.3rem 0.5rem; }
      .btn-subtle:hover { background: var(--border-subtle); color: var(--text); }
      .btn-sm { padding: 0.3rem 0.6rem; font-size: 0.775rem; }
      .btn-danger { background: #dc2626; color: white; border-color: #dc2626; }
      .btn-danger:hover { background: #b91c1c; }
      .btn-success { background: #16a34a; color: white; border-color: #16a34a; }
      .btn-success:hover { background: #15803d; }

      .section-group { margin-bottom: 1.75rem; }
      .section-header { font-size: 0.85rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 0.65rem; display: flex; align-items: center; gap: 0.5rem; }
      .section-header::after { content: ''; flex: 1; height: 1px; background: var(--border); }

      .grid-stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 0.85rem; margin-bottom: 1.25rem; }
      .stat-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 0.85rem 1rem; box-shadow: var(--shadow-sm); cursor: pointer; transition: border-color 0.15s ease; display: flex; flex-direction: column; justify-content: space-between; }
      .stat-card:hover { border-color: var(--primary); }
      .stat-header { display: flex; align-items: center; justify-content: space-between; color: var(--text-muted); font-size: 0.775rem; font-weight: 600; }
      .stat-icon { width: 28px; height: 28px; border-radius: var(--radius-sm); background: var(--primary-light); color: var(--primary); display: flex; align-items: center; justify-content: center; }
      .stat-icon i { width: 14px; height: 14px; }
      .stat-value { font-size: 1.35rem; font-weight: 700; color: var(--text); letter-spacing: -0.02em; margin-top: 0.4rem; }

      .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius-lg); box-shadow: var(--shadow-sm); overflow: hidden; width: 100%; margin-bottom: 1rem; }
      .table-container { width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; }
      table { width: 100%; border-collapse: collapse; font-size: 0.8rem; text-align: left; white-space: nowrap; }
      th { background: #f8fafc; font-weight: 600; color: var(--text-muted); padding: 0.6rem 0.75rem; border-bottom: 1px solid var(--border); font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.04em; }
      td { padding: 0.65rem 0.75rem; border-bottom: 1px solid var(--border-subtle); color: var(--text); vertical-align: middle; }
      tbody tr:last-child td { border-bottom: none; }
      tbody tr:hover { background: #f8fafc; }

      .checks-table { width: 100%; border-collapse: collapse; }
      .checks-row { cursor: pointer; transition: background 0.15s ease; }
      .checks-row:hover { background: #f1f5f9 !important; }
      .result-badge { display: inline-flex; align-items: center; justify-content: center; width: 26px; height: 26px; border-radius: 50%; color: white; font-weight: 700; flex-shrink: 0; }
      .result-pass { background: #16a34a; }
      .result-fail { background: #dc2626; }
      .result-none { background: #cbd5e1; color: #475569; }
      .train-tag { display: inline-block; background: #e2e8f0; color: #1e293b; padding: 2px 7px; border-radius: 10px; font-size: 0.7rem; font-weight: 600; margin-right: 3px; margin-top: 2px; }
      
      .status-badge { display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 0.7rem; font-weight: 600; }
      .status-open { background: #fee2e2; color: #991b1b; }
      .status-resolved { background: #dcfce7; color: #166534; }

      .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(15, 23, 42, 0.4); backdrop-filter: blur(2px); justify-content: center; align-items: center; z-index: 1100; padding: 1rem; }
      .modal { background: white; padding: 1.25rem; border-radius: var(--radius-lg); width: 100%; max-width: 520px; max-height: 85vh; overflow-y: auto; box-shadow: var(--shadow-lg); border: 1px solid var(--border); }
      .modal h3 { font-size: 1rem; font-weight: 700; color: var(--text); margin-bottom: 0.85rem; border-bottom: 1px solid var(--border); padding-bottom: 0.5rem; }
      .form-group { margin-bottom: 0.75rem; }
      .form-group label { display: block; font-size: 0.75rem; font-weight: 600; margin-bottom: 0.2rem; color: var(--text); }
      .form-group input[type="text"], .form-group input[type="date"], .form-group input[type="password"], .form-group textarea, .form-group select { width: 100%; padding: 0.45rem 0.6rem; border: 1px solid var(--border); border-radius: var(--radius); font-size: 0.8rem; outline: none; background: white; transition: border-color 0.15s; }
      .checkbox-list { display: flex; flex-direction: column; gap: 0.4rem; border: 1px solid var(--border); padding: 0.5rem; border-radius: var(--radius); background: #f8fafc; max-height: 140px; overflow-y: auto; }
      .checkbox-list label { display: flex; align-items: center; gap: 0.4rem; font-size: 0.8rem; font-weight: 500; cursor: pointer; margin: 0; }
      .modal-actions { display: flex; justify-content: flex-end; gap: 0.4rem; margin-top: 1rem; border-top: 1px solid var(--border); padding-top: 0.75rem; }

      .calendar-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; text-align: center; margin-top: 0.5rem; width: 100%; }
      .cal-header { font-size: 0.7rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; padding: 6px 0; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .cal-day { background: white; border: 1px solid var(--border); border-radius: var(--radius); min-height: 60px; min-width: 0; padding: 4px; display: flex; flex-direction: column; justify-content: space-between; cursor: pointer; transition: all 0.15s; font-size: 0.8rem; position: relative; overflow: hidden; }
      .cal-day:hover { border-color: var(--primary); background: var(--primary-light); }
      .cal-day.empty { background: transparent; border: none; cursor: default; }
      .cal-day.selected { border-color: var(--primary); background: var(--primary-light); font-weight: bold; }
      .cal-day.has-event { background: #fefce8; border-color: #fde047; }
      .cal-badge { font-size: 0.65rem; background: var(--primary); color: white; padding: 1px 4px; border-radius: 4px; margin-top: 2px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; box-sizing: border-box; }
      .cal-event-dot { font-size: 0.6rem; background: #ca8a04; color: white; padding: 1px 3px; border-radius: 3px; margin-top: 1px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; box-sizing: border-box; }

      @media (max-width: 480px) {
        .cal-day { min-height: 44px; padding: 3px; font-size: 0.7rem; }
        .cal-header { font-size: 0.6rem; padding: 4px 0; }
        .cal-badge, .cal-event-dot { font-size: 0.52rem; padding: 1px 2px; }
        .calendar-grid { gap: 2px; }
      }

      .calendar-layout { display: grid; grid-template-columns: 1fr 350px; gap: 1.25rem; align-items: start; }
      .preview-thumb { width: 100%; max-height: 120px; object-fit: cover; border-radius: var(--radius); margin-top: 0.4rem; border: 1px solid var(--border); }

      #print-area { display: none; }
      @media print {
        body * { visibility: hidden !important; }
        #print-area, #print-area * { visibility: visible !important; }
        #print-area { display: block; position: absolute; left: 0; top: 0; width: 100%; padding: 20px; background: white; color: black; }
        .print-data-table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        .print-data-table th, .print-data-table td { border: 1px solid #ccc; padding: 10px; text-align: left; }
      }

      @media (max-width: 900px) {
        .calendar-layout { grid-template-columns: 1fr; }
      }

      @media (max-width: 768px) {
        .menu-btn { display: block; }
        sidebar { 
          position: fixed; top: 56px; left: 0; bottom: 0; height: calc(100vh - 56px); z-index: 1000; 
          transform: translateX(-100%); width: 230px; padding-top: 0.85rem; padding-bottom: 4rem; overflow-y: auto; 
        }
        sidebar.active { transform: translateX(0); }
        .overlay.active { display: block; }
        main { padding: 0.85rem; }
        .calendar-layout .card { padding: 0.75rem !important; }
      }
    </style>
  </head>
  <body>
    <div style="position:fixed; bottom:8px; right:8px; z-index:9999; background:#0f172a; color:#94a3b8; font-size:10px; font-family:monospace; padding:3px 7px; border-radius:4px; opacity:0.85; pointer-events:none;">BUILD-15</div>
    <div id="print-area"></div>
    <header>
      <div class="header-left">
        <button class="menu-btn" onclick="toggleMenu()" aria-label="Toggle navigation menu">
          <i data-lucide="menu"></i>
        </button>
        <svg class="header-logo" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
          <circle cx="50" cy="50" r="48" fill="#fcf8ee" stroke="#1e3a1e" stroke-width="4"/>
          <defs>
            <path id="topArc" d="M 15,50 A 35,35 0 0,1 85,50" />
            <path id="bottomArc" d="M 85,50 A 35,35 0 0,1 15,50" />
          </defs>
          <text font-family="-apple-system, sans-serif" font-size="8.5" font-weight="bold" fill="#1e3a1e">
            <textPath href="#topArc" startOffset="50%" text-anchor="middle">WHEELS OF TIME</textPath>
          </text>
          <text font-family="-apple-system, sans-serif" font-size="7" font-weight="bold" fill="#1e3a1e">
            <textPath href="#bottomArc" startOffset="50%" text-anchor="middle">RAILWAY MUSEUM</textPath>
          </text>
          <rect x="20" y="38" width="60" height="24" rx="12" fill="#1e3a1e"/>
          <rect x="22" y="40" width="56" height="20" rx="10" fill="#fcf8ee"/>
          <text x="50" y="49" font-family="serif" font-size="6.5" font-weight="bold" fill="#1e3a1e" text-anchor="middle">ELHAM VALLEY</text>
          <text x="50" y="56" font-family="-apple-system, sans-serif" font-size="4" font-weight="bold" fill="#1e3a1e" text-anchor="middle">LINE TRUST</text>
        </svg>
        <div class="brand-title">
          <span>EVLT Operations</span>
        </div>
      </div>
      <div class="header-right">
        <div class="user-select-container" id="currentUserBadge" style="cursor: pointer;" onclick="openLoginModal()" title="Switch Account">
          <i data-lucide="user" style="width: 14px; height: 14px; color: white;"></i>
          <span id="currentUserDisplayName">Not Logged In</span>
        </div>
      </div>
    </header>

    <div class="overlay" id="overlay" onclick="toggleMenu()"></div>
    <div class="app-container">
      <sidebar id="sidebar">
        <!-- Dynamically rendered -->
      </sidebar>
      <main id="content">
        <!-- Renders instantly -->
      </main>
    </div>

    <!-- Login Modal -->
    <div class="modal-overlay" id="loginModal">
      <div class="modal" style="max-width: 380px;">
        <h3>Sign In to EVLT Operations</h3>
        <form onsubmit="handleUserLogin(event)">
          <div class="form-group">
            <label>Select Account</label>
            <select id="loginUserSelect" required class="form-group">
              <option value="">-- Choose Account --</option>
            </select>
          </div>
          <div class="form-group">
            <label>PIN Code / Password</label>
            <input type="password" id="loginUserPin" placeholder="Enter PIN" required>
          </div>
          <div id="loginErrorMsg" style="color: #dc2626; font-size: 0.75rem; margin-bottom: 0.5rem; display: none;">Incorrect PIN. Please try again.</div>
          <div class="form-group" style="display:flex; align-items:center; gap:0.5rem;">
            <input type="checkbox" id="rememberDeviceCheckbox" style="width:auto;" checked>
            <label for="rememberDeviceCheckbox" style="margin:0; font-weight:500;">Remember this device</label>
          </div>
          <div class="modal-actions" style="border:none; padding:0; margin-top:1rem;">
            <button type="submit" class="btn btn-primary" style="width:100%; justify-content:center;">Sign In</button>
          </div>
        </form>
      </div>
    </div>

    <!-- Modals -->
    <div class="modal-overlay" id="opCheckModal">
      <div class="modal">
        <h3 id="opCheckTitle">Log Inspection Check</h3>
        <form onsubmit="saveOpCheck(event)">
          <input type="hidden" id="opCheckKey" value="">
          <div class="form-group">
            <label>Inspected By (Volunteer)</label>
            <select id="opCheckInspector" required></select>
          </div>
          <div class="form-group">
            <label>Inspection Outcome</label>
            <select id="opCheckResult" required onchange="toggleOpCheckReason(this.value)">
              <option value="Pass">Pass</option>
              <option value="Fail">Fail</option>
              <option value="Not Completed">Not Completed</option>
            </select>
          </div>
          <div class="form-group" id="reasonSelectionGroup" style="display: none;">
            <label id="reasonLabel">Reason for Failure</label>
            <textarea id="opCheckReason" rows="3" placeholder="Specify failure reason or defect..."></textarea>
          </div>
          <div class="form-group" id="trainSelectionGroup">
            <label>Locomotives Used</label>
            <select id="opCheckLocoSelect" class="form-group">
              <option value="">-- Select Locomotive --</option>
            </select>
          </div>
          <div class="modal-actions">
            <button type="button" class="btn btn-secondary" onclick="closeModal('opCheckModal')">Cancel</button>
            <button type="submit" class="btn btn-primary">Save Check</button>
          </div>
        </form>
      </div>
    </div>

    <div class="modal-overlay" id="incidentModal">
      <div class="modal">
        <h3 id="incidentModalTitle">Log Incident / Defect</h3>
        <form id="incidentForm" onsubmit="saveIncident(event); return false;">
          <div class="form-group">
            <label>Asset / Locomotive / Location</label>
            <input type="text" id="incidentAsset" placeholder="e.g. Canadian Pacific, North Turnout" required>
          </div>
          <div class="form-group">
            <label>Defect Description</label>
            <textarea id="incidentDesc" rows="3" placeholder="Describe the issue or defect..." required></textarea>
          </div>
          <div class="form-group">
            <label>Red Tag Status (Out of Service)</label>
            <select id="incidentRedTag">
              <option value="Operational">Operational (Minor Issue)</option>
              <option value="Out of Service">Out of Service (LOCKOUT / RED TAG)</option>
            </select>
          </div>
          <div class="form-group">
            <label>Defect Photo (Optional)</label>
            <input type="file" id="incidentPhoto" accept="image/*" onchange="previewIncidentPhoto(event)">
            <img id="incidentPhotoPreview" class="preview-thumb" style="display:none;" />
          </div>
          <div class="modal-actions">
            <button type="button" class="btn btn-secondary" onclick="closeModal('incidentModal')">Cancel</button>
            <button type="submit" class="btn btn-primary" id="incidentSubmitBtn">Report Defect</button>
          </div>
        </form>
      </div>
    </div>

    <div class="modal-overlay" id="maintLogModal">
      <div class="modal">
        <h3>Add Maintenance Log</h3>
        <form onsubmit="saveMaintenanceLogEntry(event)">
          <input type="hidden" id="maintLogAsset" value="">
          <div class="form-group">
            <label>Work Done / Description</label>
            <textarea id="maintWorkDone" rows="3" placeholder="Describe the maintenance or repairs performed..." required></textarea>
          </div>
          <div class="form-group" style="display: flex; gap: 0.5rem;">
            <div style="flex:1;">
              <label>Start Date</label>
              <input type="date" id="maintStartDate" required>
            </div>
            <div style="flex:1;">
              <label>End Date</label>
              <input type="date" id="maintEndDate" required>
            </div>
          </div>
          <div class="form-group">
            <label>Performed By</label>
            <div id="maintVolunteersList" class="checkbox-list">
            </div>
          </div>
          <div class="form-group">
            <label>Update Asset State</label>
            <select id="maintUpdateState">
              <option value="">-- Keep Current State --</option>
              <option value="In Service">In Service</option>
              <option value="Out of Service">Out of Service</option>
              <option value="Overhaul">Overhaul</option>
            </select>
          </div>
          <div class="modal-actions">
            <button type="button" class="btn btn-secondary" onclick="closeModal('maintLogModal')">Cancel</button>
            <button type="submit" class="btn btn-primary">Save Log Entry</button>
          </div>
        </form>
      </div>
    </div>

    <!-- Dedicated Action Modal -->
    <div class="modal-overlay" id="actionModal">
      <div class="modal">
        <h3 id="actionModalTitle">Add Action / Task</h3>
        <form id="actionForm" onsubmit="saveActionItem(event)">
          <input type="hidden" id="actionEditIndex" value="">
          <div class="form-group">
            <label>Action Title</label>
            <input type="text" id="act_title" placeholder="e.g. Monthly carriage service" required>
          </div>
          <div class="form-group">
            <label>Description / Details</label>
            <textarea id="act_desc" rows="2" placeholder="Detailed instructions or parts required..."></textarea>
          </div>
          <div class="form-group">
            <label>Assigned To (Select Multiple)</label>
            <!-- REPLACEMENT: Multi-select Checkbox list -->
            <div id="act_assigned_list" class="checkbox-list">
              <!-- Dynamically Populated -->
            </div>
          </div>
          <div class="form-group">
            <label>Due Date</label>
            <input type="date" id="act_duedate" required>
          </div>

      ];

      function getTodayString() {
        const today = new Date();
        return today.toISOString().split('T')[0];
      }

      function toISODate(dateStr) {
        if (!dateStr) return null;
        if (/^\d{4}-\d{2}-\d{2}/.test(dateStr)) return dateStr.slice(0, 10);
        const m = String(dateStr).match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
        if (m) return `${m[3]}-${m[2].padStart(2, '0')}-${m[1].padStart(2, '0')}`;
        return null;
      }

      function closeModal(modalId) {
        document.getElementById(modalId).style.display = 'none';
      }

      let database, auth;
      try {
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        database = firebase.database();
        auth = firebase.auth();
      } catch (e) {
        console.error("Firebase init error", e);
      }

      function normaliseDb() {
        if (!db || typeof db !== 'object') db = {};
        ['incidents','volunteers','maintenanceLogs','fleetItems','actions','events','historicalArchive','clockLogs'].forEach(key => {
            const val = db[key];
            if (Array.isArray(val)) return;
            if (val && typeof val === 'object') {
              db[key] = Object.keys(val).sort((a, b) => Number(a) - Number(b)).map(k => val[k]).filter(v => v !== null && v !== undefined);
            } else if (!db[key]) {
              db[key] = [];
            }
          });
      }

      function attachDatabaseListener() {
        if (!database) { renderInitialApp(); return; }
        database.ref('EVLT_ADMIN_DB').on('value', (snapshot) => {
          const val = snapshot.val();
          if (val) {
            db = val;
            normaliseDb();
          }
          renderInitialApp();
        }, (err) => {
          console.error("Database connection error:", err);
        });
      }

      const REMEMBER_KEY = 'evltRememberedUser';
      function saveRememberedUser() {
        if (!currentUser) return;
        const record = currentUser.isSystemAdmin ? { type: 'admin' } : { type: 'volunteer', name: currentUser.name };
        try { localStorage.setItem(REMEMBER_KEY, JSON.stringify(record)); } catch (e) {}
      }
      function clearRememberedUser() { try { localStorage.removeItem(REMEMBER_KEY); } catch (e) {} }
      
      function tryRestoreRememberedUser() {
        let record = null;
        try { record = JSON.parse(localStorage.getItem(REMEMBER_KEY)); } catch (e) {}
        if (!record) return false;
        if (record.type === 'admin') {
          currentUser = { name: 'System Admin', isSystemAdmin: true };
          return true;
        }
        if (record.type === 'volunteer') {
          const vols = db.volunteers || [];
          const vol = vols.find(v => getVolunteerName(v) === record.name);
          if (vol) {
            currentUser = { name: getVolunteerName(vol), isSystemAdmin: false, volData: vol };
            return true;
          }
        }
        clearRememberedUser();
        return false;
      }

      function logoutDevice() {
        clearRememberedUser();
        currentUser = null;
        document.getElementById('currentUserDisplayName').innerText = 'Not Logged In';
        openLoginModal();
      }

      function renderInitialApp() {
        updateLoginUserDropdown();
        if (!currentUser) {
          if (tryRestoreRememberedUser()) {
            document.getElementById('currentUserDisplayName').innerText = currentUser.name;
            renderSidebar();
            navigate(currentView);
            return;
          }
          openLoginModal();
        } else {
          renderSidebar();
          navigate(currentView);
        }
      }

      document.addEventListener("DOMContentLoaded", () => {
        renderDashboard();
        if (auth) {
          auth.signInAnonymously().then(() => { attachDatabaseListener(); }).catch((err) => { attachDatabaseListener(); });
        } else {
          attachDatabaseListener();
        }
      });

      function updateLoginUserDropdown() {
        const select = document.getElementById('loginUserSelect');
        if (!select) return;
        const vols = db.volunteers || [];
        let html = '<option value="">-- Choose Account --</option>';
        html += '<option value="SYSTEM_ADMIN">System Administrator (Full Access)</option>';
        html += vols.map(v => `<option value="${getVolunteerName(v)}">${getVolunteerName(v)}</option>`).join('');
        const currentVal = select.value;
        select.innerHTML = html;
        select.value = currentVal;
      }

      function openLoginModal() {
        updateLoginUserDropdown();
        document.getElementById('loginUserPin').value = '';
        document.getElementById('loginErrorMsg').style.display = 'none';
        document.getElementById('loginModal').style.display = 'flex';
      }

      function handleUserLogin(e) {
        e.preventDefault();
        const accountVal = document.getElementById('loginUserSelect').value;
        const pinVal = document.getElementById('loginUserPin').value.trim();
        const errDiv = document.getElementById('loginErrorMsg');
        if (!accountVal) return;

        if (accountVal === 'SYSTEM_ADMIN') {
          if (pinVal === '2026') {
            currentUser = { name: 'System Admin', isSystemAdmin: true };
            finishLogin();
          } else { errDiv.style.display = 'block'; }
          return;
        }

        const vols = db.volunteers || [];
        const vol = vols.find(v => getVolunteerName(v) === accountVal);
        if (vol) {
          const userPin = vol.Pin || vol.pin || '1234';
          if (pinVal === userPin || pinVal === '2026') {
            currentUser = { name: getVolunteerName(vol), isSystemAdmin: false, volData: vol };
            finishLogin();
          } else { errDiv.style.display = 'block'; }
        }
      }

      function finishLogin() {
        if (document.getElementById('rememberDeviceCheckbox').checked) { saveRememberedUser(); } 
        else { clearRememberedUser(); }
        closeModal('loginModal');
        document.getElementById('currentUserDisplayName').innerText = currentUser.name;
        renderSidebar();
        navigate('dashboard');
      }

      function renderSidebar() {
        const sidebar = document.getElementById('sidebar');
        if (!currentUser) return;
        const sections = {};
        ALL_PAGES.forEach(p => {
          if (!sections[p.section]) sections[p.section] = [];
          sections[p.section].push(p);
        });

        let html = '';
        Object.entries(sections).forEach(([secName, pages]) => {
          html += `<div class="sidebar-section-label">${secName}</div>`;
          pages.forEach(p => {
            html += `<a href="#" class="${currentView === p.key ? 'active' : ''}" onclick="navigate('${p.key}'); return false;"><i data-lucide="${p.icon}"></i> ${p.label}</a>`;
          });
        });
        sidebar.innerHTML = html;
        if (window.lucide) lucide.createIcons();
      }

      function toggleMenu() {
        document.getElementById('sidebar').classList.toggle('active');
        document.getElementById('overlay').classList.toggle('active');
      }

      function getVolunteerName(v) { return v.Name || v.name || 'Unknown'; }
      function getRedTaggedAssets() {
        return (db.incidents || [])
          .filter(i => String(i['Red Tag Status']).toLowerCase() === 'out of service' && String(i.Status).toLowerCase() !== 'resolved')
          .map(i => String(i.asset || i['Asset / Location'] || '').toLowerCase());
      }

      function navigate(view) {
        currentView = view;
        renderSidebar();
        switch(view) {
          case 'dashboard': renderDashboard(); break;
          case 'clock': renderClock(); break;
          case 'calendar': renderCalendarView(); break;
          case 'incidents': renderIncidents(); break; /* Using new render function */

          case 'actions': renderActionsPage(); break;
          case 'maintenance': renderMaintenancePage(); break;
          case 'eurotunnel': renderEurotunnelPage(); break; /* Handling new Eurotunnel Page */

          default: renderDashboard();
        }

      function getDriverStatusHtml() { return ''; /* Simplified for this build */ }

      function renderDashboard() {
        const content = document.getElementById('content');
        const activeClockIns = (db.clockLogs || []).filter(l => l.status === 'Clocked In').length;

        content.innerHTML = `

                    <tr class="checks-row" onclick="openOpCheckModal('trackWalk')">

                      <td style="text-align:right;"><button class="btn btn-secondary btn-sm" onclick="event.stopPropagation(); openOpCheckModal('trackWalk')">Edit Check</button></td>

                  </tbody>
                </table>
              </div>
            </div>
          </div>
          
          <div class="grid-stats">
            <div class="stat-card" onclick="navigate('clock')"><div class="stat-header"><span>Staff On Site</span><div class="stat-icon"><i data-lucide="users"></i></div></div><div class="stat-value">${activeClockIns}</div></div>

      function openOpCheckModal(checkKey) {
        document.getElementById('opCheckKey').value = checkKey;

        const vols = db.volunteers || [];
        inspectorSelect.innerHTML = '<option value="">-- Select --</option>' + vols.map(v => `<option value="${getVolunteerName(v)}">${getVolunteerName(v)}</option>`).join('');
        document.getElementById('opCheckModal').style.display = 'flex';
      }

      function saveOpCheck(e) {
        e.preventDefault();
        const checkKey = document.getElementById('opCheckKey').value;
        if (!db.dailyChecks) db.dailyChecks = {};
        db.dailyChecks[checkKey] = {
          inspector: document.getElementById('opCheckInspector').value,
          result: document.getElementById('opCheckResult').value,
          notes: document.getElementById('opCheckReason').value
        };
        if(database) database.ref('EVLT_ADMIN_DB/dailyChecks').set(db.dailyChecks);
        closeModal('opCheckModal');
        renderDashboard();
      }

      function renderIncidents() {
        const content = document.getElementById('content');
        const incidents = db.incidents || [];
        
        let html = `
          <div class="page-header">
            <div class="page-title">
              <h2>Incident & Defect Log</h2>
              <p>Track reported defects and out-of-service assets.</p>
            </div>
            <button class="btn btn-primary" onclick="openIncidentModal()">Report Defect</button>
          </div>
          <div class="card">
            <div class="table-container">
              <table>
                <thead>
                  <tr>
                    <th>Date</th>
                    <th>Asset/Location</th>
                    <th>Description</th>
                    <th>Red Tag Status</th>
                    <th>Status</th>
                    <th style="text-align:right;">Actions</th>
                  </tr>
                </thead>
                <tbody>
        `;

        if(incidents.length === 0) {
          html += `<tr><td colspan="6" style="text-align:center; color:var(--text-muted); padding:2rem;">No incidents reported yet.</td></tr>`;
        } else {
          incidents.forEach((inc, idx) => {
            const isResolved = String(inc.Status).toLowerCase() === 'resolved';
            const isRedTagged = String(inc['Red Tag Status']).toLowerCase() === 'out of service';
            
            html += `
              <tr style="opacity: ${isResolved ? '0.6' : '1'}">
                <td>${inc.Date || '-'}</td>
                <td style="font-weight:600;">${inc.asset || inc['Asset / Location'] || 'Unknown'}</td>
                <td style="max-width: 250px; white-space: normal;">${inc.Description || inc.desc || '-'}</td>
                <td><span class="status-badge ${isRedTagged && !isResolved ? 'status-open' : 'status-resolved'}">${inc['Red Tag Status'] || 'Operational'}</span></td>
                <td><span class="status-badge ${isResolved ? 'status-resolved' : 'status-open'}">${inc.Status || 'Open'}</span></td>
                <td style="text-align:right;">

                  <button class="btn btn-danger btn-sm" onclick="deleteIncident(${idx})"><i data-lucide="trash-2"></i></button>
                </td>
              </tr>
            `;
          });
        }
        
        html += `</tbody></table></div></div>`;
        content.innerHTML = html;
        if(window.lucide) lucide.createIcons();

        editingIncidentIndex = index;
        const existing = (index !== null && db.incidents) ? db.incidents[index] : null;
        document.getElementById('incidentAsset').value = existing ? (existing.asset || '') : '';
        document.getElementById('incidentDesc').value = existing ? (existing.Description || '') : '';
        document.getElementById('incidentRedTag').value = existing ? (existing['Red Tag Status'] || 'Operational') : 'Operational';
        document.getElementById('incidentModal').style.display = 'flex';
      }

      function saveIncident(e) {
        e.preventDefault();
        if (!db.incidents) db.incidents = [];
        const inc = {
          asset: document.getElementById('incidentAsset').value,
          Description: document.getElementById('incidentDesc').value,
          'Red Tag Status': document.getElementById('incidentRedTag').value,
          Status: 'Open',
          Date: new Date().toLocaleDateString('en-GB')
        };
        if (editingIncidentIndex !== null) {
          db.incidents[editingIncidentIndex] = { ...db.incidents[editingIncidentIndex], ...inc };
        } else {
          db.incidents.push(inc);
        }
        if(database) database.ref('EVLT_ADMIN_DB/incidents').set(db.incidents);
        closeModal('incidentModal');
        renderIncidents();
      }

      function resolveIncident(idx) {
        if(db.incidents && db.incidents[idx]) {
          db.incidents[idx].Status = 'Resolved';
          if(database) database.ref(`EVLT_ADMIN_DB/incidents/${idx}`).set(db.incidents[idx]);
          renderIncidents();
        }
      }

      function deleteIncident(idx) {
        if(confirm('Delete this defect?')) {
          db.incidents.splice(idx, 1);
          if(database) database.ref('EVLT_ADMIN_DB/incidents').set(db.incidents);
          renderIncidents();
        }
      }

        const content = document.getElementById('content');
        const actions = db.actions || [];

            <div class="page-title">

          DueDate: document.getElementById('act_duedate').value,
          Priority: document.getElementById('act_priority').value
        });

            <tr>
              <td><strong>${arch.date}</strong></td>
              <td>${twStatus}</td>
              <td>${trains}</td>
              <td><button class="btn btn-secondary btn-sm" onclick="openEditArchiveModal(${originalIdx})">Edit Record</button></td>
            </tr>
          `;
        });
        
        html += `</tbody></table></div></div>`;
        content.innerHTML = html;
      }

      function openEditArchiveModal(index) {
        const arch = db.historicalArchive[index];
        document.getElementById('editArchiveIndex').value = index;
        document.getElementById('editArchiveDateTxt').innerText = arch.date;
        
        // Structured Fields
        document.getElementById('editArch_TrackWalk').value = (arch.trackWalk && arch.trackWalk.result) ? arch.trackWalk.result : '';
        document.getElementById('editArch_TestRun').value = (arch.testRun && arch.testRun.result) ? arch.testRun.result : '';
        
        // Checkboxes for Trains
        const trainList = document.getElementById('editArch_Trains_List');
        const ranTrains = arch.runningTrains || [];
        let trainsHtml = '';
        AVAILABLE_TRAINS.forEach(t => {
          const isChecked = ranTrains.includes(t) ? 'checked' : '';
          trainsHtml += `<label><input type="checkbox" value="${t}" class="arch-train-cb" ${isChecked}> ${t}</label>`;
        });
        trainList.innerHTML = trainsHtml;
        
        // Textareas for summaries
        document.getElementById('editArch_Volunteers').value = (arch.attendance || []).map(a => a.name).join(', ');
        document.getElementById('editArch_Incidents').value = (arch.incidents || []).map(i => i.asset + ': ' + i.description).join('\n');
        document.getElementById('editArch_Maintenance').value = (arch.maintenance || []).map(m => m.asset + ': ' + m.workDone).join('\n');
        
        document.getElementById('editArchiveModal').style.display = 'flex';
      }

      function saveArchiveEdit(e) {
        e.preventDefault();
        const idx = document.getElementById('editArchiveIndex').value;
        const arch = db.historicalArchive[idx];
        
        // Retrieve Selects
        const twVal = document.getElementById('editArch_TrackWalk').value;
        if(twVal) {
          arch.trackWalk = { result: twVal };
        } else {
          arch.trackWalk = null;
        }
        
        const trVal = document.getElementById('editArch_TestRun').value;
        if(trVal) {
          arch.testRun = { result: trVal };
        } else {
          arch.testRun = null;
        }

        // Retrieve Checked Trains
        const trainCbs = document.querySelectorAll('.arch-train-cb');
        const selectedTrains = [];
        trainCbs.forEach(cb => {
          if(cb.checked) selectedTrains.push(cb.value);
        });
        arch.runningTrains = selectedTrains;
        
        if(database) database.ref('EVLT_ADMIN_DB/historicalArchive').set(db.historicalArchive);
        closeModal('editArchiveModal');
        renderArchives();
      }

      function renderEurotunnelPage() {
        const content = document.getElementById('content');
        
        let html = `
          <div class="page-header">
            <div class="page-title">
              <h2>Eurotunnel N Gauge Layout</h2>
              <p>Management and maintenance logs for the working N gauge model layout.</p>
            </div>
          </div>
          
          <div class="card" style="padding: 3rem 2rem; text-align: center; max-width: 600px; margin: 2rem auto; border: 2px dashed var(--border);">
            <div style="background: var(--primary-light); width: 80px; height: 80px; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 1.5rem auto;">
              <i data-lucide="train" style="width: 40px; height: 40px; color: var(--primary);"></i>
            </div>
            <h3 style="font-size: 1.25rem; font-weight: 700; color: var(--text); margin-bottom: 0.5rem;">Layout Management Hub</h3>
            <p style="color: var(--text-muted); font-size: 0.9rem; line-height: 1.5; margin-bottom: 1.5rem;">
              This page has been designated as the central hub for everything related to the working N gauge model layout of the Eurotunnel. We are ready to build out stock tracking, layout schematics, and maintenance procedures here when you are ready to finish setting it up.
            </p>
            <button class="btn btn-secondary" onclick="alert('Module ready for future development.')">Configure Layout Settings</button>
          </div>
        `;
        content.innerHTML = html;
        if(window.lucide) lucide.createIcons();
      }

      function renderClock() { document.getElementById('content').innerHTML = `<h2>Clock / Attendance view loaded.</h2>`; }
      function renderCalendarView() { document.getElementById('content').innerHTML = `<h2>Calendar view loaded.</h2>`; }
      function renderVolunteers() { document.getElementById('content').innerHTML = `<h2>Volunteers Manager loaded.</h2>`; }
      function renderMaintenancePage() { document.getElementById('content').innerHTML = `<h2>Maintenance Page loaded.</h2>`; }
    </script>
  </body>
