<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>EVLT Admin System</title>
        <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
        <style>
    :root { 
      --primary: #184517; 
      --bg: #f8fafc; 
      --card-bg: #ffffff; 
      --text: #0f172a; 
      --border: #e2e8f0; 
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
    body { background: var(--bg); color: var(--text); display: flex; flex-direction: column; min-height: 100vh; }
    header { background: var(--primary); color: white; padding: 1rem 1.5rem; display: flex; justify-content: space-between; align-items: center; }
    header h1 { font-size: 1.25rem; font-weight: 700; letter-spacing: 0.5px; }
    .import-btn { background: #10b981; color: white; padding: 0.5rem 1rem; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; }
    .import-btn:hover { background: #059669; }
    .app-container { display: flex; flex: 1; }
    sidebar { width: 180px; background: #0f172a; color: white; padding: 1rem 0; flex-shrink: 0; }
    sidebar a { display: block; padding: 0.75rem 1.25rem; color: #94a3b8; text-decoration: none; font-weight: 500; border-left: 4px solid transparent; }
    sidebar a:hover { background: #1e293b; color: white; }
    sidebar a.active { background: #1e293b; color: white; border-left-color: var(--primary); }
    main { flex: 1; padding: 1.5rem; overflow-x: auto; }
    .card { background: white; border: 1px solid var(--border); border-radius: 6px; padding: 1.25rem; margin-bottom: 1rem; }
    table { width: 100%; border-collapse: collapse; margin-top: 1rem; font-size: 0.9rem; }
    th, td { padding: 0.75rem; border-bottom: 1px solid var(--border); text-align: left; }
    th { background: #f1f5f9; font-weight: 600; color: #1e293b; }
  </style>
      </head>
      <body>
        <header>
          <h1>ELHAM VALLEY LINE TRUST — ADMIN DASHBOARD</h1>
          <div>
            <input type="file" id="excelFileInput" accept=".xlsx, .xls" style="display: none;" onchange="importExcel(event)">
              <button class="import-btn" onclick="document.getElementById('excelFileInput').click()">📁 Import Excel File</button>
            </div>
          </header>
          <div class="app-container">
            <sidebar>
              <a href="#" class="active" onclick="navigate('dashboard')">Dashboard</a>
              <a href="#" onclick="navigate('actions')">Actions</a>
              <a href="#" onclick="navigate('volunteers')">Volunteers</a>
              <a href="#" onclick="navigate('events')">Events</a>
              <a href="#" onclick="navigate('maintenance')">Maintenance</a>
              <a href="#" onclick="navigate('assets')">Assets</a>
              <a href="#" onclick="navigate('stock')">Stock</a>
              <a href="#" onclick="navigate('suppliers')">Suppliers</a>
              <a href="#" onclick="navigate('enquiries')">Enquiries</a>
              <a href="#" onclick="navigate('documents')">Documents</a>
            </sidebar>
            <main id="content">
              <!-- Dynamic content rendered here -->
            </main>
          </div>
          <script>
    let db = JSON.parse(localStorage.getItem('EVLT_ADMIN_DB') || '{}');

    function importExcel(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(evt) {
        const data = new Uint8Array(evt.target.result);
        const workbook = XLSX.read(data, { type: 'array' });

        const parseSheet = (sheetName) => {
          const sheet = workbook.Sheets[sheetName];
          if (!sheet) return [];
          return XLSX.utils.sheet_to_json(sheet, { defval: "" });
        };

        db = {
          volunteers: parseSheet('Volunteers'),
          events: parseSheet('Events'),
          maintenance: parseSheet('Maintenance'),
          assets: parseSheet('Assets'),
          stock: parseSheet('Stock'),
          suppliers: parseSheet('Suppliers'),
          enquiries: parseSheet('Enquiries'),
          documents: parseSheet('Documents'),
          actions: parseSheet('Actions')
        };

        localStorage.setItem('EVLT_ADMIN_DB', JSON.stringify(db));
        alert('Excel data imported successfully!');
        navigate('dashboard');
      };
      reader.readAsArrayBuffer(file);
    }

    function navigate(view) {
      document.querySelectorAll('sidebar a').forEach(a => a.classList.remove('active'));
      const activeLink = document.querySelector(`sidebar a[onclick="navigate('${view}')"]`);
      if(activeLink) activeLink.classList.add('active');

      const content = document.getElementById('content');
      if (view === 'dashboard') {
        content.innerHTML = `
          <div class="card">
            <h2>Dashboard Overview</h2>
            <p style="margin-top:0.75rem;">Volunteers Registered: <strong>${(db.volunteers || []).length}</strong></p>
            <p>Events Scheduled: <strong>${(db.events || []).length}</strong></p>
            <p>Maintenance Jobs: <strong>${(db.maintenance || []).length}</strong></p>
            <p>Assets Listed: <strong>${(db.assets || []).length}</strong></p>
            <p>Stock Items Listed: <strong>${(db.stock || []).length}</strong></p>
            <p>Actions Recorded: <strong>${(db.actions || []).length}</strong></p>
          </div>`;
      } else {
        const items = db[view] || [];
        if (items.length === 0) {
          content.innerHTML = `<div class="card"><h2>${view.toUpperCase()}</h2><p>No rows found in this section. Add data to the <strong>${view}</strong> tab in your Excel file and import again.</p></div>`;
          return;
        }

        const headers = Array.from(new Set(items.flatMap(obj => Object.keys(obj))));
        
        content.innerHTML = `
          <div class="card">
            <h2>${view.toUpperCase()} (${items.length} records)</h2>
            <table>
              <thead><tr>${headers.map(h => `<th>${h}</th>`).join('')}</tr></thead>
              <tbody>
                ${items.map(row => `<tr>${headers.map(h => `<td>${row[h] !== undefined ? row[h] : ''}</td>`).join('')}</tr>`).join('')}
              </tbody>
            </table>
          </div>`;
      }
    }

    window.onload = () => navigate('dashboard');
  </script>
        </body>
      </html>
